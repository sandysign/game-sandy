<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1f2a22">
<title>Jaga Benteng</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jaga Benteng">
<style>
@font-face{font-family:'Lilita One';src:url(fonts/lilita.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Nunito;src:url(fonts/nunito-600.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:Nunito;src:url(fonts/nunito-800.woff2) format('woff2');font-weight:800;font-display:swap}
/* VOICE: petualangan ceria, sedikit tegang
   IDEA: diorama meja — padang rumput, jalan pasir, menara batu, benteng di ujung
   PICTURE: peta 16x9 penuh layar dengan menara & musuh bulat berbayang
   COLOUR+TYPE: hijau rumput, pasir, batu abu hangat, emas untuk uang; housing hijau tua; Lilita One + Nunito
   LAYOUT: HUD tipis atas, peta penuh, panel bangun/upgrade muncul di dekat petak */
:root{color-scheme:dark;--bg:#1f2a22;--panel:#2c3a30;--deep:#18211b;--ink:#f6f1e4;--mut:#b9c4b5;--gold:#ffc93c;--red:#ff6b6b}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 Nunito,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:none}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud{display:flex;align-items:center;gap:8px;padding:5px 10px;min-height:44px}
#hud .t{font:18px/1 'Lilita One',sans-serif;color:var(--gold);white-space:nowrap}
.chip{background:var(--panel);border-radius:999px;padding:4px 11px;font-weight:800;font-size:14px;white-space:nowrap;flex:none}
.chip b{color:var(--gold)}.chip.hp b{color:var(--red)}
#next{flex:1 1 0;min-width:0;text-align:right;font-size:12px;color:var(--mut);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{height:36px;min-width:40px;border:0;border-radius:10px;background:var(--panel);font-weight:800;font-size:15px;padding:0 10px;flex:none}
.hb.muted{opacity:.45;text-decoration:line-through}
#go{background:var(--gold);color:#2b2410;font:16px 'Lilita One',sans-serif;padding:0 14px;box-shadow:0 3px 0 #b8861d}
#go:disabled{background:var(--panel);color:var(--mut);box-shadow:none}
#game{position:relative;display:grid;place-items:center;padding:2px 6px 6px}
#cv{display:block;border-radius:10px;box-shadow:0 0 0 3px #111812,0 12px 30px #0008;touch-action:none}
#pnl{position:absolute;z-index:4;background:var(--deep);border:2px solid #ffffff1c;border-radius:16px;padding:8px;box-shadow:0 12px 30px #000a;display:none}
#pnl.show{display:block}
.blist{display:flex;gap:6px}
.bt{width:74px;border:0;border-radius:12px;background:var(--panel);padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:12px}
.bt svg{width:34px;height:34px}
.bt b{font-size:12px;color:var(--gold)}
.bt:disabled{opacity:.4}
.tinfo{min-width:200px}
.tinfo h3{margin:0 2px 2px;font:18px 'Lilita One',sans-serif}
.tinfo p{margin:0 2px 8px;font-size:12px;color:var(--mut)}
.trow{display:flex;gap:6px}
.trow button{flex:1;min-height:44px;border:0;border-radius:12px;font-weight:800;font-size:14px;background:var(--panel)}
.trow .up{background:var(--gold);color:#2b2410}
.trow .up:disabled{background:var(--panel);color:var(--mut)}
#ov{position:fixed;inset:0;display:grid;place-items:center;background:#0b100cd9;z-index:10;padding:12px}
#ov.hide{display:none}
.card{background:var(--panel);border-radius:20px;padding:16px 20px;max-width:680px;width:100%;max-height:calc(100dvh - 24px);overflow:auto;text-align:center;box-shadow:0 20px 50px #000a}
.card h1{font:36px/1.05 'Lilita One',sans-serif;margin:0 0 4px;color:var(--gold)}
.card h2{font:26px/1.1 'Lilita One',sans-serif;margin:0 0 4px}
.card p{margin:6px 0;color:var(--mut)}
.maps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0 4px}
.mp{background:var(--deep);border:2px solid #ffffff14;border-radius:14px;padding:8px;color:var(--ink);text-align:center}
.mp:disabled{opacity:.45}
.mp canvas{width:100%;aspect-ratio:16/9;border-radius:8px;display:block;margin-bottom:6px}
.mp b{font:18px 'Lilita One',sans-serif;display:block}
.mp span{font-size:13px;color:var(--gold);letter-spacing:2px}
.tips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px;text-align:left}
.tip{background:var(--deep);border-radius:12px;padding:8px;font-size:12px;color:var(--mut)}
.tip b{display:block;color:var(--ink);font-size:13px}
.go{margin:12px 6px 0;min-height:48px;padding:0 26px;border:0;border-radius:14px;background:var(--gold);color:#2b2410;font:20px 'Lilita One',sans-serif;box-shadow:0 5px 0 #b8861d}
.go.alt{background:#c9d2c4;box-shadow:0 5px 0 #8d9a88}
.big{font:40px 'Lilita One',sans-serif;color:var(--gold);letter-spacing:4px;margin:4px 0}
#rot{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:var(--bg);text-align:center;padding:24px}
#rot h2{font:28px 'Lilita One',sans-serif;color:var(--gold);margin:18px 0 6px}
#rot p{color:var(--mut);margin:0}
#rot .ph{width:70px;height:120px;border:5px solid var(--ink);border-radius:14px;margin:0 auto;animation:turn 2s ease-in-out infinite}
@keyframes turn{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rot{display:grid}}
@media (max-width:940px){#hud .t{display:none}}
@media (max-width:760px){.tips{grid-template-columns:repeat(2,minmax(0,1fr))}#next{display:none}.chip{font-size:13px;padding:4px 9px}#hud{gap:6px}}
@media (prefers-reduced-motion:reduce){#rot .ph{animation:none;transform:rotate(-90deg)}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span class="t">Jaga Benteng</span>
    <span class="chip hp">♥ <b id="hLife">20</b></span>
    <span class="chip">Emas <b id="hGold">0</b></span>
    <span class="chip">Gelombang <b id="hWave">0/20</b></span>
    <span id="next"></span>
    <button class="hb" id="go">Mulai</button>
    <button class="hb" id="spd" aria-label="Kecepatan">1×</button>
    <button class="hb" id="mus" aria-label="Musik">♪</button>
    <button class="hb" id="pause" aria-label="Jeda">II</button>
  </div>
  <div id="game"><canvas id="cv"></canvas><div id="pnl"></div></div>
</div>
<div id="ov"><div class="card" id="card"></div></div>
<div id="rot"><div><div class="ph"></div><h2>Putar HP lo</h2><p>Jaga Benteng dimainin landscape.</p></div></div>

<script>
{
const COLS=16,ROWS=9,WAVES=20;
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),gameEl=$('game'),pnl=$('pnl'),ov=$('ov'),card=$('card');

/* ---------- data ---------- */
const MAPS=[
  {n:'Lembah',pts:[[-1,1],[4,1],[4,6],[9,6],[9,2],[13,2],[13,7],[16,7]],gold:180,hp:1,seed:11},
  {n:'Ular',pts:[[-1,4],[2,4],[2,1],[6,1],[6,7],[10,7],[10,1],[13,1],[13,5],[16,5]],gold:200,hp:1.2,seed:23},
  {n:'Zigzag',pts:[[-1,1],[14,1],[14,4],[1,4],[1,7],[16,7]],gold:200,hp:1.45,seed:37}];
const TW={
  p:{n:'Panah',cost:50,air:1,desc:'Cepat, bisa kena musuh terbang',lv:[{dmg:8,rate:2,range:2.4},{c:70,dmg:14,rate:2.4,range:2.6},{c:120,dmg:24,rate:3,range:2.9}]},
  m:{n:'Meriam',cost:80,air:0,desc:'Ledakan area, cuma musuh darat',lv:[{dmg:22,rate:.7,range:2.6,splash:.9},{c:110,dmg:40,rate:.75,range:2.8,splash:1},{c:180,dmg:70,rate:.8,range:3,splash:1.2}]},
  e:{n:'Es',cost:60,air:1,desc:'Bikin musuh lambat',lv:[{dmg:3,rate:1.2,range:2.2,slow:.4},{c:80,dmg:5,rate:1.3,range:2.4,slow:.5},{c:130,dmg:8,rate:1.4,range:2.6,slow:.6,splash:.8}]},
  l:{n:'Petir',cost:100,air:1,desc:'Tembus baja, nyambar beberapa musuh',lv:[{dmg:30,rate:.8,range:2.5,chain:2},{c:140,dmg:50,rate:.85,range:2.6,chain:3},{c:220,dmg:85,rate:.9,range:2.8,chain:4}]}};
const EN={
  b:{n:'Prajurit',hp:1,sp:1,rw:5,col:'#e2445c',gap:.9},
  f:{n:'Pelari',hp:.55,sp:1.8,rw:4,col:'#ffa62b',gap:.55},
  a:{n:'Baja',hp:2.2,sp:.7,rw:9,armor:4,col:'#7d8aa8',gap:1.1},
  y:{n:'Terbang',hp:.8,sp:1.25,rw:6,air:1,col:'#36c5f0',gap:.8},
  B:{n:'Raksasa',hp:16,sp:.55,rw:60,armor:3,col:'#8a4fd6',boss:1,leak:5,gap:2}};
function waveDef(w){
  const q=[],n=6+Math.floor(w*1.4),pool=['b'];
  if(w>=2)pool.push('f');if(w>=4)pool.push('a');if(w>=6)pool.push('y');
  const main=w>=2&&w%4===2?'f':w>=4&&w%4===0?'a':w>=6&&w%6===3?'y':null;
  for(let i=0;i<n;i++)q.push(main&&i%3!==0?main:pool[(i*7+w)%pool.length]);
  if(w%5===0){q.push('B');if(w>=15)q.push('B')}
  return q;
}
function waveLabel(w){const c={};for(const t of waveDef(w))c[t]=(c[t]||0)+1;return Object.entries(c).map(([t,n])=>`${EN[t].n} ×${n}`).join(', ')}

/* ---------- save ---------- */
const SK='jagabenteng_save';
let save={stars:[0,0,0],music:true};
try{const s=JSON.parse(localStorage.getItem(SK)||'null');if(s)save={...save,...s}}catch(e){}
const persist=()=>{try{localStorage.setItem(SK,JSON.stringify(save))}catch(e){}};

/* ---------- audio ---------- */
let AC=null;
function unlock(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();musicInit()}catch(e){}}
function sfx(type){
  if(!AC)return;const t=AC.currentTime;
  if(type==='boom'){const len=.3,buf=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
    const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=700;g.gain.value=.25;
    s.buffer=buf;s.connect(f).connect(g).connect(AC.destination);s.start(t);return}
  const P={shot:[900,500,.05,'triangle',.035],zap:[1400,300,.12,'sawtooth',.05],ice:[1200,900,.08,'sine',.05],build:[300,600,.12,'square',.08],coin:[988,1480,.08,'square',.03],leak:[300,90,.35,'sawtooth',.12],win:[440,880,.5,'triangle',.15],wave:[392,784,.25,'triangle',.1]}[type];
  if(!P)return;const o=AC.createOscillator(),g=AC.createGain();o.connect(g).connect(AC.destination);o.type=P[3];
  o.frequency.setValueAtTime(P[0],t);o.frequency.exponentialRampToValueAtTime(P[1],t+P[2]);
  g.gain.setValueAtTime(P[4],t);g.gain.exponentialRampToValueAtTime(.001,t+P[2]+.02);o.start(t);o.stop(t+P[2]+.04);
}
let sfxBudget=0;const shotSfx=k=>{if(sfxBudget>0)return;sfxBudget=.06;sfx(k)};
// musik latar
const BPM=128,CH_A=[50,46,53,48],CH_B=[46,48,45,50];
const MEL=[
  [[74,0,77,0,81,0,79,77],[74,0,0,72,70,0,72,0],[77,0,81,0,84,0,81,79],[76,0,72,0,76,79,0,0]],
  [[81,0,79,0,77,0,76,74],[77,0,0,76,74,0,72,0],[72,74,77,0,79,0,77,76],[74,0,0,0,0,0,0,0]],
  [[70,0,74,0,77,0,74,0],[72,0,76,0,79,0,76,0],[73,0,76,0,81,0,79,76],[77,0,74,0,0,0,0,0]],
  [[82,0,81,0,79,0,77,0],[79,0,77,0,76,0,72,0],[76,0,79,0,81,0,85,0],[86,0,0,0,81,0,0,0]]];
const Mu={bus:null,noise:null,step:0,nextT:0};
function musicInit(){
  if(!AC||Mu.bus)return;Mu.bus=AC.createGain();Mu.bus.gain.value=.18;Mu.bus.connect(AC.destination);
  Mu.noise=AC.createBuffer(1,AC.sampleRate*.4,AC.sampleRate);const d=Mu.noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  Mu.nextT=AC.currentTime+.1;setInterval(musicTick,25);
}
function tone(m,t,dur,type,vol){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=440*Math.pow(2,(m-69)/12);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(Mu.bus);o.start(t);o.stop(t+dur+.02)}
function hit(t,hp,vol,dur){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=Mu.noise;f.type='highpass';f.frequency.value=hp;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(Mu.bus);s.start(t);s.stop(t+dur+.02)}
function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);
  g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g).connect(Mu.bus);o.start(t);o.stop(t+.18)}
function playStep(s,t,d){
  const bar=Math.floor(s/8),i=s%8,sec=Math.floor(bar/4),b=bar%4,root=(sec<2?CH_A:CH_B)[b],m=MEL[sec][b][i];
  tone(root-12+(i%4===2?7:0),t,d*.9,'triangle',.6);
  if(m){tone(m,t,d*.95,'square',.08);tone(m-12,t,d*.6,'triangle',.06)}
  if(i===0||i===5)kick(t);if(i===2||i===6)hit(t,1800,.18,.1);hit(t,8000,i%2?.04:.02,.03);
}
function musicTick(){
  if(!AC||AC.state!=='running')return;const now=AC.currentTime,on=save.music&&!document.hidden&&state!=='pause';
  if(!on||Mu.nextT<now-.25){Mu.nextT=now+.05;if(!on)return}
  const d=60/BPM/2;while(Mu.nextT<now+.15){playStep(Mu.step,Mu.nextT,d);Mu.step=(Mu.step+1)%128;Mu.nextT+=d}
}
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

/* ---------- state ---------- */
let T=40,DPR=1,bg=null,bgDirty=true;
let mapI=0,map=null,pathTiles=new Set(),decor=new Set(),segs=[],pathLen=0;
let towers=[],enemies=[],shots=[],zaps=[],booms=[],floats=[],spawnQ=[],spawnT=0;
let gold=0,lives=20,wave=0,waveOn=false,state='menu',speed=1,selT=null,buildAt=null,time=0,killed=0;

function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function loadMap(i){
  mapI=i;map=MAPS[i];pathTiles=new Set();decor=new Set();segs=[];pathLen=0;
  const P=map.pts.map(([x,y])=>[x+.5,y+.5]);
  for(let k=0;k<P.length-1;k++){
    const [x1,y1]=P[k],[x2,y2]=P[k+1],len=Math.hypot(x2-x1,y2-y1);segs.push({x1,y1,x2,y2,len,at:pathLen});pathLen+=len;
    const [a,b]=map.pts[k],[c,d]=map.pts[k+1];
    for(let x=Math.min(a,c);x<=Math.max(a,c);x++)for(let y=Math.min(b,d);y<=Math.max(b,d);y++)if(x>=0&&x<COLS&&y>=0&&y<ROWS)pathTiles.add(y*COLS+x);
  }
  const r=rng(map.seed);
  for(let n=0;n<40&&decor.size<11;n++){const k=Math.floor(r()*COLS*ROWS);if(!pathTiles.has(k))decor.add(k)}
  bgDirty=true;
}
function posAt(d){
  for(const s of segs)if(d<=s.at+s.len){const f=(d-s.at)/s.len;return[s.x1+(s.x2-s.x1)*f,s.y1+(s.y2-s.y1)*f]}
  const s=segs[segs.length-1];return[s.x2,s.y2];
}
function startMap(i){
  loadMap(i);towers=[];enemies=[];shots=[];zaps=[];booms=[];floats=[];spawnQ=[];
  gold=map.gold;lives=20;wave=0;waveOn=false;speed=1;selT=null;buildAt=null;killed=0;
  state='play';ov.classList.add('hide');closePnl();fit();hud();
}

/* ---------- gameplay ---------- */
function startWave(){
  if(state!=='play'||spawnQ.length||wave>=WAVES)return;
  if(waveOn&&enemies.length){gold+=15;floats.push({x:COLS-1.5,y:.8,txt:'+15 cepat!',t:1.2,c:'#ffc93c'})}
  wave++;waveOn=true;spawnQ=waveDef(wave);spawnT=0;sfx('wave');hud();
}
function spawn(t){
  const E=EN[t],hp=18*Math.pow(1.2,wave-1)*map.hp*E.hp;
  const [x,y]=posAt(0);
  enemies.push({t,hp,max:hp,sp:E.sp,d:0,x,y,slowT:0,slowF:0,armor:E.armor||0,air:!!E.air,rw:E.rw,ph:Math.random()*6,boss:!!E.boss,leak:E.leak||1});
}
function stat(t){return TW[t.k].lv[t.lv]}
function inRange(t,e,r){return(e.x-t.x-.5)**2+(e.y-t.y-.5)**2<=r*r}
function damage(e,dmg,pierce){if(e.hp<=0)return;e.hp-=Math.max(1,dmg-(pierce?0:e.armor));e.hitT=.12}
function update(dt){
  time+=dt;sfxBudget-=dt;
  if(spawnQ.length){spawnT-=dt;if(spawnT<=0){const t=spawnQ.shift();spawn(t);spawnT=EN[t].gap}}
  for(const e of enemies){
    if(e.slowT>0)e.slowT-=dt;if(e.hitT>0)e.hitT-=dt;
    e.d+=e.sp*(e.slowT>0?1-e.slowF:1)*dt;e.ph+=dt*8;
    const p=posAt(e.d);e.x=p[0];e.y=p[1];
    if(e.d>=pathLen){e.hp=-1e9;e.gone=1;lives-=e.leak;sfx('leak');buzz(80);hud();
      if(lives<=0){lives=0;lose();return}}
  }
  for(const t of towers){
    t.cd-=dt;const S=stat(t),D=TW[t.k];
    let tgt=null,best=-1;
    for(const e of enemies)if(e.hp>0&&(D.air||!e.air)&&inRange(t,e,S.range)&&e.d>best){best=e.d;tgt=e}
    if(tgt)t.ang=Math.atan2(tgt.y-t.y-.5,tgt.x-t.x-.5);
    if(!tgt||t.cd>0)continue;
    t.cd=1/S.rate;t.fire=.12;
    const ox=t.x+.5+Math.cos(t.ang)*.3,oy=t.y+.5+Math.sin(t.ang)*.3;
    if(t.k==='p'){shots.push({k:'p',x:ox,y:oy,e:tgt,sp:9,dmg:S.dmg});shotSfx('shot')}
    if(t.k==='e'){shots.push({k:'e',x:ox,y:oy,e:tgt,sp:7,dmg:S.dmg,slow:S.slow,splash:S.splash});shotSfx('ice')}
    if(t.k==='m'){const lead=tgt.sp*(tgt.slowT>0?1-tgt.slowF:1)*.55,p=posAt(Math.min(pathLen,tgt.d+lead));
      shots.push({k:'m',sx:ox,sy:oy,tx:p[0],ty:p[1],f:0,dur:.55,dmg:S.dmg,splash:S.splash});shotSfx('shot')}
    if(t.k==='l'){
      const hitL=[tgt],pts=[[ox,oy],[tgt.x,tgt.y]];let cur=tgt;
      for(let c=1;c<S.chain;c++){let nb=null,bd=1.8;
        for(const e of enemies)if(e.hp>0&&!hitL.includes(e)){const d=Math.hypot(e.x-cur.x,e.y-cur.y);if(d<bd){bd=d;nb=e}}
        if(!nb)break;hitL.push(nb);pts.push([nb.x,nb.y]);cur=nb}
      hitL.forEach((e,i)=>damage(e,S.dmg*(i?0.7:1),true));zaps.push({pts,t:.16});shotSfx('zap');
    }
  }
  for(const s of shots){
    if(s.k==='m'){s.f+=dt/s.dur;if(s.f>=1){s.dead=1;booms.push({x:s.tx,y:s.ty,r:s.splash,t:.35});sfx('boom');
      for(const e of enemies)if(!e.air&&Math.hypot(e.x-s.tx,e.y-s.ty)<=s.splash)damage(e,s.dmg)}continue}
    const tx=s.e.x,ty=s.e.y,dx=tx-s.x,dy=ty-s.y,dd=Math.hypot(dx,dy),st=s.sp*dt;
    if(dd<=st+.12){s.dead=1;
      if(s.k==='p'&&s.e.hp>0)damage(s.e,s.dmg);
      if(s.k==='e'){const list=s.splash?enemies.filter(e=>Math.hypot(e.x-tx,e.y-ty)<=s.splash):[s.e];
        for(const e of list){if(e.hp<=0)continue;damage(e,s.dmg);const f=e.boss?s.slow*.5:s.slow;if(f>=e.slowF||e.slowT<=0){e.slowF=f}e.slowT=1.6}
        if(s.splash)booms.push({x:tx,y:ty,r:s.splash,t:.3,ice:1})}
    }else{s.x+=dx/dd*st;s.y+=dy/dd*st}
    if(s.e.hp<=0&&!s.dead&&s.k!=='m'){s.e={x:tx,y:ty,hp:0}}
  }
  shots=shots.filter(s=>!s.dead);
  for(const e of enemies)if(e.hp<=0&&!e.gone&&!e.paid){e.paid=1;gold+=e.rw;killed++;floats.push({x:e.x,y:e.y-.3,txt:'+'+e.rw,t:.8,c:'#ffc93c'});shotSfx('coin');hud()}
  enemies=enemies.filter(e=>e.hp>0);
  zaps=zaps.filter(z=>(z.t-=dt)>0);booms=booms.filter(b=>(b.t-=dt)>0);
  floats=floats.filter(f=>{f.t-=dt;f.y-=dt*.7;return f.t>0});
  for(const t of towers)if(t.fire>0)t.fire-=dt;
  if(waveOn&&!spawnQ.length&&!enemies.length){
    waveOn=false;const bonus=20+wave*2;gold+=bonus;floats.push({x:COLS/2,y:ROWS/2,txt:`Gelombang ${wave} beres! +${bonus}`,t:1.6,c:'#fff',big:1});hud();
    if(wave>=WAVES)win();
  }
}
function win(){

}

}
function upgrade(){const t=selT;if(!t||t.lv>=2)return;const c=TW[t.k].lv[t.lv+1].c;if(gold<c)return;gold-=c;t.spent+=c;t.lv++;sfx('build');hud();openPnl()}

/* ---------- drawing ---------- */
function rr(g,x,y,w,h,r){g.beginPath();g.roundRect?g.roundRect(x,y,w,h,r):g.rect(x,y,w,h)}
function drawMapTo(g,scale,mi){
  const m=MAPS[mi],P=new Set(),D=new Set();
  if(mi===mapI&&map){pathTiles.forEach(k=>P.add(k));decor.forEach(k=>D.add(k))}
  else{for(let k=0;k<m.pts.length-1;k++){const [a,b]=m.pts[k],[c,d]=m.pts[k+1];for(let x=Math.min(a,c);x<=Math.max(a,c);x++)for(let y=Math.min(b,d);y<=Math.max(b,d);y++)if(x>=0&&x<COLS)P.add(y*COLS+x)}
    const r=rng(m.seed);for(let n=0;n<40&&D.size<11;n++){const k=Math.floor(r()*COLS*ROWS);if(!P.has(k))D.add(k)}}
  g.setTransform(scale,0,0,scale,0,0);
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){g.fillStyle=(x+y)%2?'#7fb35a':'#78ad54';g.fillRect(x,y,1,1)}
  const r=rng(m.seed+5);g.fillStyle='#6a9e48';
  for(let i=0;i<60;i++){g.beginPath();g.arc(r()*COLS,r()*ROWS,.04+r()*.05,0,7);g.fill()}
  P.forEach(k=>{const x=k%COLS,y=Math.floor(k/COLS);g.fillStyle='#5f8f43';g.fillRect(x-.04,y-.04,1.08,1.08)});
  P.forEach(k=>{const x=k%COLS,y=Math.floor(k/COLS);g.fillStyle='#dcbf86';g.fillRect(x,y,1,1)});
  P.forEach(k=>{const x=k%COLS,y=Math.floor(k/COLS);g.fillStyle='#cfae70';g.beginPath();g.arc(x+.3,y+.35,.05,0,7);g.arc(x+.7,y+.7,.04,0,7);g.fill()});
  D.forEach(k=>{const x=k%COLS,y=Math.floor(k/COLS);
    if(k%3){g.fillStyle='#00000030';g.beginPath();g.ellipse(x+.5,y+.82,.32,.1,0,0,7);g.fill();g.fillStyle='#7a5434';g.fillRect(x+.45,y+.55,.1,.28);
      g.fillStyle='#3f7d3a';g.beginPath();g.arc(x+.5,y+.45,.32,0,7);g.fill();g.fillStyle='#57a04c';g.beginPath();g.arc(x+.42,y+.37,.18,0,7);g.fill()}
    else{g.fillStyle='#00000030';g.beginPath();g.ellipse(x+.5,y+.75,.32,.09,0,0,7);g.fill();g.fillStyle='#9a958a';g.beginPath();g.ellipse(x+.5,y+.6,.3,.22,0,0,7);g.fill();
      g.fillStyle='#b9b4a8';g.beginPath();g.ellipse(x+.43,y+.53,.14,.09,0,0,7);g.fill()}});
  const L=m.pts[m.pts.length-1],ex=Math.min(L[0],COLS-1),ey=L[1];
  g.fillStyle='#00000035';g.fillRect(ex+.08,ey+.15,.9,.85);
  g.fillStyle='#a49c8d';g.fillRect(ex+.1,ey+.12,.8,.78);g.fillStyle='#8a8274';for(let i=0;i<4;i++)g.fillRect(ex+.1+i*.22,ey+.02,.13,.14);
  g.fillStyle='#5b3d2a';rr(g,ex+.35,ey+.48,.3,.42,[.15,.15,0,0]);g.fill();
  g.fillStyle='#e2445c';g.fillRect(ex+.48,ey-.38,.04,.42);g.beginPath();g.moveTo(ex+.52,ey-.38);g.lineTo(ex+.8,ey-.28);g.lineTo(ex+.52,ey-.18);g.fill();
}
function buildBg(){if(!bg)bg=document.createElement('canvas');bg.width=cv.width;bg.height=cv.height;drawMapTo(bg.getContext('2d'),DPR*T,mapI);bgDirty=false}
function drawTower(t){
  const c=ctx,x=t.x+.5,y=t.y+.5,k=t.k,rec=t.fire>0?t.fire*.6:0;
  c.fillStyle='#00000035';rr(c,t.x+.12,t.y+.2,.8,.78,.16);c.fill();
  c.fillStyle='#8d8577';rr(c,t.x+.1,t.y+.1,.8,.8,.16);c.fill();c.fillStyle='#a39b8c';rr(c,t.x+.1,t.y+.1,.8,.14,.08);c.fill();
  c.save();c.translate(x,y);
  if(k==='p'){c.fillStyle='#c8913a';c.beginPath();c.arc(0,0,.27,0,7);c.fill();c.rotate(t.ang);c.strokeStyle='#5a3a1a';c.lineWidth=.07;c.beginPath();c.arc(-.05-rec,0,.22,-1.2,1.2);c.stroke();
    c.strokeStyle='#fff';c.lineWidth=.05;c.beginPath();c.moveTo(-.12-rec,0);c.lineTo(.28,0);c.stroke()}
  if(k==='m'){c.fillStyle='#3d3e45';c.beginPath();c.arc(0,0,.3,0,7);c.fill();c.rotate(t.ang);c.fillStyle='#2a2b30';rr(c,.02-rec,-.09,.42,.18,.05);c.fill();c.fillStyle='#55565e';c.beginPath();c.arc(0,0,.14,0,7);c.fill()}
  if(k==='e'){c.fillStyle='#36a3d6';c.beginPath();c.moveTo(0,-.33);c.lineTo(.24,0);c.lineTo(0,.33);c.lineTo(-.24,0);c.fill();
    c.fillStyle='#bfefff';c.beginPath();c.moveTo(0,-.24);c.lineTo(.13,0);c.lineTo(0,.05);c.lineTo(-.13,0);c.fill()}
  if(k==='l'){const g=.5+Math.sin(time*6+t.x)*.3;c.fillStyle=`rgba(166,108,255,${.25*g})`;c.beginPath();c.arc(0,0,.4,0,7);c.fill();
    c.fillStyle='#6b3fb0';c.beginPath();c.arc(0,0,.27,0,7);c.fill();c.fillStyle='#c9a6ff';c.beginPath();c.arc(-.05,-.06,.13,0,7);c.fill()}
  c.restore();
  c.fillStyle='#ffc93c';for(let i=0;i<=t.lv;i++){c.beginPath();c.arc(t.x+.3+i*.2,t.y+.82,.06,0,7);c.fill()}
}
function drawEnemy(e){
  const c=ctx,E=EN[e.t],r=e.boss?.4:.26,bob=Math.sin(e.ph)*.03,fy=e.air?-.32:0;
  c.fillStyle='#00000035';c.beginPath();c.ellipse(e.x,e.y+.24,r*.95,r*.35,0,0,7);c.fill();
  c.save();c.translate(e.x,e.y+fy+bob);
  if(e.air){c.fillStyle='#ffffffb0';const w=Math.sin(e.ph*2)*.12;c.beginPath();c.ellipse(-.24,-.04,.18,.08+w*.3,-.4,0,7);c.ellipse(.24,-.04,.18,.08+w*.3,.4,0,7);c.fill()}
  c.fillStyle=e.hitT>0?'#fff':E.col;c.beginPath();c.arc(0,0,r,0,7);c.fill();
  if(e.armor){c.strokeStyle='#4a5470';c.lineWidth=.05;c.beginPath();c.arc(0,0,r*.75,Math.PI*1.1,Math.PI*1.9);c.stroke();c.beginPath();c.arc(0,0,r*.45,Math.PI*1.1,Math.PI*1.9);c.stroke()}
  c.fillStyle='#ffffff40';c.beginPath();c.arc(-r*.35,-r*.4,r*.3,0,7);c.fill();
  c.fillStyle='#fff';c.beginPath();c.arc(-r*.32,-r*.05,r*.25,0,7);c.arc(r*.32,-r*.05,r*.25,0,7);c.fill();
  c.fillStyle='#1a1120';c.beginPath();c.arc(-r*.28,-r*.03,r*.12,0,7);c.arc(r*.36,-r*.03,r*.12,0,7);c.fill();
  if(e.boss){c.fillStyle='#ffc93c';c.beginPath();c.moveTo(-.2,-.36);c.lineTo(-.12,-.52);c.lineTo(0,-.4);c.lineTo(.12,-.52);c.lineTo(.2,-.36);c.fill()}
  if(e.slowT>0){c.strokeStyle='#9be3ff';c.lineWidth=.05;c.beginPath();c.arc(0,0,r+.05,0,7);c.stroke()}
  c.restore();
  if(e.hp<e.max){const w=e.boss?.8:.5,y=e.y+fy-r-.14;c.fillStyle='#000a';c.fillRect(e.x-w/2,y,w,.07);c.fillStyle=e.hp/e.max>.4?'#5fd35f':'#ff6b6b';c.fillRect(e.x-w/2,y,w*Math.max(0,e.hp/e.max),.07)}
}
function draw(){
  if(!map)return;if(bgDirty)buildBg();
  const c=ctx,S=DPR*T;c.setTransform(1,0,0,1,0,0);c.drawImage(bg,0,0);c.setTransform(S,0,0,S,0,0);
  if(buildAt){c.fillStyle='#ffffff40';c.fillRect(buildAt.x,buildAt.y,1,1);c.strokeStyle='#fff';c.lineWidth=.05;c.strokeRect(buildAt.x+.03,buildAt.y+.03,.94,.94)}
  const sorted=[...enemies].sort((a,b)=>a.y-b.y);
  for(const e of sorted)if(!e.air)drawEnemy(e);
  for(const t of towers)drawTower(t);
  if(selT){const s=stat(selT);c.fillStyle='#ffffff18';c.strokeStyle='#ffffffaa';c.lineWidth=.04;c.beginPath();c.arc(selT.x+.5,selT.y+.5,s.range,0,7);c.fill();c.stroke()}
  for(const s of shots){
    if(s.k==='m'){const x=s.sx+(s.tx-s.sx)*s.f,y=s.sy+(s.ty-s.sy)*s.f,h=Math.sin(Math.PI*s.f)*.7;
      c.fillStyle='#00000040';c.beginPath();c.ellipse(x,y+.1,.1,.04,0,0,7);c.fill();c.fillStyle='#22232a';c.beginPath();c.arc(x,y-h,.1,0,7);c.fill()}
    else{c.fillStyle=s.k==='e'?'#bfefff':'#fff4c2';c.beginPath();c.arc(s.x,s.y,s.k==='e'?.09:.06,0,7);c.fill()}
  }
  for(const b of booms){const a=b.t/.35;c.fillStyle=b.ice?`rgba(155,227,255,${a*.5})`:`rgba(255,170,60,${a*.6})`;c.beginPath();c.arc(b.x,b.y,b.r*(1.1-a*.4),0,7);c.fill()}
  for(const e of sorted)if(e.air)drawEnemy(e);
  for(const z of zaps){c.strokeStyle=`rgba(201,166,255,${z.t/.16})`;c.lineWidth=.09;c.beginPath();
    z.pts.forEach((p,i)=>{if(!i){c.moveTo(p[0],p[1]);return}const q=z.pts[i-1];for(let k=1;k<=4;k++){const f=k/4;c.lineTo(q[0]+(p[0]-q[0])*f+(k<4?(Math.random()-.5)*.25:0),q[1]+(p[1]-q[1])*f+(k<4?(Math.random()-.5)*.25:0))}});
    c.stroke();c.strokeStyle='#fff';c.lineWidth=.03;c.stroke()}
  c.setTransform(DPR,0,0,DPR,0,0);c.textAlign='center';c.lineJoin='round';
  for(const f of floats){c.globalAlpha=Math.min(1,f.t*2);c.font=`${Math.round(T*(f.big?.7:.36))}px 'Lilita One',sans-serif`;
    c.lineWidth=f.big?6:3;c.strokeStyle='#1f2a22';c.strokeText(f.txt,f.x*T,f.y*T);c.fillStyle=f.c;c.fillText(f.txt,f.x*T,f.y*T)}
  c.globalAlpha=1;
}

function togglePause(){if(state==='play'){state='pause';closePnl();selT=null;showCard('pause')}else if(state==='pause'){state='play';ov.classList.add('hide')}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')togglePause()});
const mqP=matchMedia('(orientation: portrait)');const onRot=()=>{if(mqP.matches&&state==='play')togglePause();setTimeout(fit,120)};
mqP.addEventListener?mqP.addEventListener('change',onRot):mqP.addListener(onRot);
addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='p')togglePause();if(e.key===' '){e.preventDefault();startWave()}});
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- sizing + loop ---------- */
function fit(){
  const w=gameEl.clientWidth-12,h=gameEl.clientHeight-8;
  T=Math.max(14,Math.floor(Math.min(w/COLS,h/ROWS)));DPR=Math.min(window.devicePixelRatio||1,2);
  cv.style.width=COLS*T+'px';cv.style.height=ROWS*T+'px';cv.width=Math.round(COLS*T*DPR);cv.height=Math.round(ROWS*T*DPR);bgDirty=true;
  if(pnl.classList.contains('show'))openPnl();
}
new ResizeObserver(fit).observe(gameEl);
loadMap(0);fit();hud();showCard('menu');
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;
  if(state==='play'){const n=speed*Math.ceil(dt/.017);for(let i=0;i<n&&state==='play';i++)update(dt*speed/n)}
  else{floats=floats.filter(f=>{f.t-=dt;return f.t>0})}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
if(location.search.includes('debug'))window.__td={get s(){return{gold,lives,wave,state,enemies:enemies.length,towers:towers.length,waveOn,spawn:spawnQ.length}},setGold:g=>{gold=g;hud()},startMap,startWave,get towers(){return towers},bt:(x,y,k)=>{if(!canBuild(x,y))return false;buildAt={x,y};build(k);closePnl();selT=null;return true},up:t=>{selT=t;upgrade();closePnl();selT=null},path:()=>[...pathTiles]};
}
