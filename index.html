<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2b1d2f">
<title>Game Sandy</title>
<link rel="icon" href="blok-ledak-icon.png">
<style>
:root{--bg:#2b1d2f;--panel:#3a2840;--ink:#fbefe0;--mut:#c9b3c4;--acc:#ffc93c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:max(28px,env(safe-area-inset-top)) 18px 40px}
h1{font-size:40px;line-height:1.05;margin:0 0 6px;color:var(--acc)}
p{color:var(--mut);margin:0 0 24px}
.list{display:grid;gap:14px;max-width:520px}
a.game{display:flex;gap:14px;align-items:center;background:var(--panel);border-radius:18px;padding:14px;color:inherit;text-decoration:none;min-height:44px}
a.game:active{transform:scale(.98)}
a.game img{width:64px;height:64px;border-radius:14px;flex:none}
a.game b{display:block;font-size:19px}
a.game span{color:var(--mut);font-size:14px}
</style>
</head>
<body>
<h1>Game Sandy</h1>
<p>Koleksi game buat dimainin di HP. Buka game-nya, terus install ke home screen biar bisa offline.</p>
<div class="list">
  <a class="game" href="blok-ledak/"><img src="blok-ledak-icon.png" alt=""><div><b>Blok Ledak</b><span>Taruh bom, hancurin bata, kalahin monster</span></div></a>
</div>
</body>
</html>
