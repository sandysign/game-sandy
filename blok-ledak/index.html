<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b1d2f">
<title>Blok Ledak</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blok Ledak">
<style>
@font-face{font-family:'Lilita One';src:url(fonts/lilita.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Nunito;src:url(fonts/nunito-600.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:Nunito;src:url(fonts/nunito-800.woff2) format('woff2');font-weight:800;font-display:swap}
/* VOICE: arcade, ceria, cepat
   IDEA: kabinet game genggam — papan bata di layar, tombol fisik di bawah
   PICTURE: arena 13x11 itu sendiri, sprite bulat dengan bayangan
   COLOUR+TYPE: plum tua housing, lantai pasir, bata terakota, aksen kuning; Lilita One + Nunito
   LAYOUT: HUD tipis, arena, joystick kiri + tombol bom kanan (landscape: mengapit arena) */
:root{color-scheme:dark;--bg:#2b1d2f;--panel:#3a2840;--ink:#fbefe0;--mut:#c9b3c4;--acc:#ffc93c;--brick:#c8553d}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 Nunito,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"hud hud" "game game" "joy bomb";padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud{grid-area:hud;display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
#hud .t{font:22px/1 'Lilita One',sans-serif;color:var(--acc);margin-right:auto;letter-spacing:.5px}
.chip{background:var(--panel);border-radius:999px;padding:4px 11px;font-weight:800;font-size:14px;white-space:nowrap}
.chip b{color:var(--acc)}
#pause{width:44px;height:44px;border:0;border-radius:12px;background:var(--panel);color:var(--ink);font:800 16px Nunito;cursor:pointer}
#game{grid-area:game;display:grid;place-items:center;padding:4px 8px}
#cv{display:block;border-radius:10px;box-shadow:0 0 0 4px #1a1120,0 14px 40px #0008}
#joy{grid-area:joy;position:relative;min-height:clamp(170px,30vh,260px)}
#joy .hint{position:absolute;inset:auto 0 18px 0;text-align:center;color:var(--mut);font-size:13px}
#base{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:radial-gradient(#ffffff14,#ffffff08);border:2px solid #ffffff22;left:50%;top:50%;transition:opacity .15s;opacity:.55}
#knob{position:absolute;width:58px;height:58px;left:36px;top:36px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6,#ffc93c 40%,#d9962a);box-shadow:0 4px 10px #0007}
#bombwrap{grid-area:bomb;display:grid;place-items:center}
#bombBtn{width:112px;height:112px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ff9b7a,#c8553d 55%,#8f3524);color:#fff;font:24px 'Lilita One',sans-serif;box-shadow:0 7px 0 #5d2418,0 12px 24px #0008;touch-action:none}
#bombBtn.on{transform:translateY(5px);box-shadow:0 2px 0 #5d2418,0 6px 14px #0008}
#ov{position:fixed;inset:0;display:grid;place-items:center;background:#1a1120cc;z-index:5;padding:24px}
#ov.hide{display:none}
.card{background:var(--panel);border-radius:22px;padding:26px 24px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 50px #000a}
.card h1{font:44px/1.05 'Lilita One',sans-serif;margin:0 0 6px;color:var(--acc)}
.card p{margin:8px 0;color:var(--mut)}
.card .big{font:28px 'Lilita One',sans-serif;color:var(--ink)}
.go{margin-top:16px;min-height:52px;padding:0 34px;border:0;border-radius:16px;background:var(--acc);color:#2b1d2f;font:22px 'Lilita One',sans-serif;cursor:pointer;box-shadow:0 5px 0 #b8861d}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #b8861d}
.go:focus-visible,#pause:focus-visible{outline:3px solid #fff;outline-offset:3px}
.legend{display:flex;justify-content:center;gap:14px;margin-top:12px;font-size:13px;color:var(--mut);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
@media (orientation:landscape) and (max-height:600px){
  #app{grid-template-columns:minmax(150px,1fr) auto minmax(150px,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"hud hud hud" "joy game bomb"}
  #hud{padding:6px 14px}#joy{min-height:0}
}
@media (prefers-reduced-motion:reduce){#base{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span class="t">Blok Ledak</span>
    <span class="chip">Lv <b id="hLv">1</b></span>
    <span class="chip">♥ <b id="hLife">3</b></span>
    <span class="chip">Skor <b id="hSc">0</b></span>
    <button id="pause" aria-label="Jeda">II</button>
  </div>
  <div id="game"><canvas id="cv"></canvas></div>
  <div id="joy"><div id="base"><div id="knob"></div></div><div class="hint">Geser di sini buat jalan</div></div>
  <div id="bombwrap"><button id="bombBtn" aria-label="Taruh bom">BOM</button></div>
</div>
<div id="ov"><div class="card" id="card"></div></div>

<script>
{
const COLS=13,ROWS=11,FUSE=2.4,FLAME=0.5;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const gameEl=document.getElementById('game'),ov=document.getElementById('ov'),card=document.getElementById('card');
const $=id=>document.getElementById(id);
let T=40,DPR=1,bg=null;
let grid,items,bombs,flames,breaking,enemies,parts,P,level=1,score=0,lives=3,state='menu',shake=0,doorKey=-1,clearT=0;
let hi=0;try{hi=+localStorage.getItem('blokledak_hi')||0}catch(e){}

/* ---------- audio ---------- */
let AC=null;
function sfx(type){
  if(!AC)return;const t=AC.currentTime;
  if(type==='boom'){
    const len=0.45,buf=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.2);
    const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
    f.type='lowpass';f.frequency.setValueAtTime(1400,t);f.frequency.exponentialRampToValueAtTime(120,t+len);
    g.gain.value=0.55;s.buffer=buf;s.connect(f).connect(g).connect(AC.destination);s.start(t);return;
  }
  const o=AC.createOscillator(),g=AC.createGain();o.connect(g).connect(AC.destination);
  const P={drop:[300,180,.08,'square'],pick:[520,1040,.18,'triangle'],die:[400,60,.7,'sawtooth'],win:[440,880,.4,'triangle']}[type];
  o.type=P[3];o.frequency.setValueAtTime(P[0],t);o.frequency.exponentialRampToValueAtTime(P[1],t+P[2]);
  g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+P[2]);o.start(t);o.stop(t+P[2]);
}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

/* ---------- level ---------- */
const K=(x,y)=>y*COLS+x;
function rnd(n){return Math.floor(Math.random()*n)}
function newLevel(){
  grid=new Uint8Array(COLS*ROWS);items={};bombs=[];flames=new Float32Array(COLS*ROWS);breaking=[];parts=[];enemies=[];clearT=0;
  const dens=Math.min(0.38+level*0.025,0.55),blocks=[];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(x===0||y===0||x===COLS-1||y===ROWS-1||(x%2===0&&y%2===0))grid[K(x,y)]=1;
    else if(x+y>3&&Math.random()<dens){grid[K(x,y)]=2;blocks.push(K(x,y))}
  }
  blocks.sort(()=>Math.random()-.5);
  doorKey=blocks.pop();items[doorKey]='door';
  const nPow=level<3?3:2;
  for(let i=0;i<nPow&&blocks.length;i++)items[blocks.pop()]=['b','f','s','b','f'][rnd(5)];
  const free=[];
  for(let y=1;y<ROWS-1;y++)for(let x=1;x<COLS-1;x++)if(grid[K(x,y)]===0&&x+y>=7)free.push([x,y]);
  free.sort(()=>Math.random()-.5);
  const n=Math.min(3+level,10);
  for(let i=0;i<n&&free.length;i++){
    const [x,y]=free.pop(),chase=level>=2&&i%3===2;
    enemies.push({x,y,tx:x,ty:y,px:x,py:y,sp:(chase?2.1:1.5)+Math.min(level*0.08,0.8),chase,dead:0,ph:Math.random()*6});
  }
  P.x=1;P.y=1;P.alive=true;P.dieT=0;P.inv=1.5;P.face=[0,1];P.walk=0;
  hud();
}
function newGame(){level=1;score=0;lives=3;P={speed:3.4,maxB:1,fire:1};newLevel();state='play';ov.classList.add('hide')}

/* ---------- helpers ---------- */
const inB=(x,y)=>x>=0&&y>=0&&x<COLS&&y<ROWS;
const bombAt=(x,y)=>bombs.find(b=>b.x===x&&b.y===y);
function passP(x,y){
  if(!inB(x,y)||grid[K(x,y)]!==0)return false;
  if(bombAt(x,y)&&!(x===Math.round(P.x)&&y===Math.round(P.y)))return false;
  return true;
}
const passE=(x,y)=>inB(x,y)&&grid[K(x,y)]===0&&!bombAt(x,y);

function moveAxis(ax,s,d){
  const A=ax,B=ax==='x'?'y':'x';
  const free=(a,b)=>ax==='x'?passP(a,b):passP(b,a);
  const ca=Math.round(P[A]),cb=Math.round(P[B]),off=P[B]-cb;
  const lanes=[cb];const o2=off>=0?cb+1:cb-1;if(Math.abs(P[B]-o2)<0.72)lanes.push(o2);
  for(const ln of lanes){
    const ahead=free(ca+s,ln),gap=P[B]-ln;
    if(Math.abs(gap)>0.001){
      if(ahead&&(ln===cb||free(ca,ln))){const m=Math.min(Math.abs(gap),d);P[B]-=Math.sign(gap)*m;return m}
      continue;
    }
    P[B]=ln;let na=P[A]+s*d;
    if(!ahead){if((P[A]-ca)*s>=0)return 0;na=s>0?Math.min(na,ca):Math.max(na,ca)}
    const m=Math.abs(na-P[A]);P[A]=na;return m;
  }
  return 0;
}

/* ---------- input ---------- */
const keys={};let joy={x:0,y:0};
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '||e.key==='x'){e.preventDefault();dropBomb()}if(e.key==='p'||e.key==='Escape')togglePause()});
addEventListener('keyup',e=>{keys[e.key]=false});
function inputVec(){
  let x=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),y=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);
  if(x||y)return{x,y};return joy;
}
const joyEl=$('joy'),base=$('base'),knob=$('knob');let joyId=null,jx=0,jy=0;
joyEl.addEventListener('pointerdown',e=>{
  e.preventDefault();unlock();joyId=e.pointerId;joyEl.setPointerCapture(joyId);
  const r=joyEl.getBoundingClientRect();jx=e.clientX-r.left;jy=e.clientY-r.top;
  base.style.left=jx+'px';base.style.top=jy+'px';base.style.opacity=1;setKnob(0,0);
});
joyEl.addEventListener('pointermove',e=>{
  if(e.pointerId!==joyId)return;const r=joyEl.getBoundingClientRect();
  let dx=e.clientX-r.left-jx,dy=e.clientY-r.top-jy;const L=Math.hypot(dx,dy),M=50;
  if(L>M){dx*=M/L;dy*=M/L}setKnob(dx,dy);
  joy=L<10?{x:0,y:0}:{x:dx/M,y:dy/M};
});
function endJoy(e){if(e.pointerId!==joyId)return;joyId=null;joy={x:0,y:0};setKnob(0,0);base.style.opacity=.55}
joyEl.addEventListener('pointerup',endJoy);joyEl.addEventListener('pointercancel',endJoy);
function setKnob(dx,dy){knob.style.transform=`translate(${dx}px,${dy}px)`}
const bb=$('bombBtn');
bb.addEventListener('pointerdown',e=>{e.preventDefault();unlock();bb.classList.add('on');dropBomb()});
['pointerup','pointercancel','pointerleave'].forEach(t=>bb.addEventListener(t,()=>bb.classList.remove('on')));
$('pause').addEventListener('click',togglePause);
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')togglePause()});
function unlock(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}else if(AC.state==='suspended')AC.resume()}

/* ---------- actions ---------- */
function dropBomb(){
  if(state!=='play'||!P.alive)return;
  const x=Math.round(P.x),y=Math.round(P.y);
  if(bombAt(x,y)||bombs.length>=P.maxB||grid[K(x,y)]!==0)return;
  bombs.push({x,y,t:FUSE,fire:P.fire});sfx('drop');buzz(15);
}
function explode(b){
  bombs.splice(bombs.indexOf(b),1);
  flames[K(b.x,b.y)]=FLAME;
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    for(let i=1;i<=b.fire;i++){
      const x=b.x+dx*i,y=b.y+dy*i,k=K(x,y);
      if(grid[k]===1)break;
      if(grid[k]===2){grid[k]=0;flames[k]=FLAME;breaking.push({x,y,t:0.4});debris(x,y);break}
      flames[k]=FLAME;
      const o=bombAt(x,y);if(o)o.t=Math.min(o.t,0.06);
    }
  }
  shake=Math.min(shake+0.12,0.25);sfx('boom');buzz(40);
}
function debris(x,y){for(let i=0;i<6;i++)parts.push({x,y,vx:(Math.random()-.5)*4,vy:-Math.random()*3-1,t:0.6})}
function killPlayer(){if(!P.alive||P.inv>0)return;P.alive=false;P.dieT=1.3;sfx('die');buzz([60,40,120])}

/* ---------- update ---------- */
function update(dt){
  if(state!=='play')return;
  shake=Math.max(0,shake-dt*0.8);
  for(let i=bombs.length-1;i>=0;i--){const b=bombs[i];b.t-=dt;if(b.t<=0)explode(b)}
  for(let i=0;i<flames.length;i++)if(flames[i]>0)flames[i]=Math.max(0,flames[i]-dt);
  breaking=breaking.filter(b=>(b.t-=dt)>0);
  parts=parts.filter(p=>{p.t-=dt;p.vy+=9*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;return p.t>0});
  // player
  if(P.alive){
    P.inv=Math.max(0,P.inv-dt);
    const v=inputVec(),d=P.speed*dt;let moved=0;
    if(v.x||v.y){
      const hx=Math.abs(v.x)>=Math.abs(v.y);
      const pa=hx?'x':'y',ps=Math.sign(hx?v.x:v.y),sa=hx?'y':'x',sv=hx?v.y:v.x;
      moved=moveAxis(pa,ps,d);
      if(moved<d*0.2&&Math.abs(sv)>0.25)moved+=moveAxis(sa,Math.sign(sv),d);
      if(moved<d*0.2&&Math.abs(sv)<=0.25)moved+=0;
      P.face=hx?[ps,0]:[0,ps];
    }
    P.walk=moved>0?P.walk+dt*12:0;
    const tx=Math.round(P.x),ty=Math.round(P.y),k=K(tx,ty);
    const it=items[k];
    if(it&&it!=='door'&&grid[k]===0){
      if(it==='b')P.maxB=Math.min(P.maxB+1,8);if(it==='f')P.fire=Math.min(P.fire+1,8);if(it==='s')P.speed=Math.min(P.speed+0.45,5.6);
      delete items[k];score+=50;sfx('pick');buzz(20);hud();
    }
    if(flames[k]>0)killPlayer();
    if(k===doorKey&&grid[k]===0&&enemies.every(e=>e.dead<0)&&Math.abs(P.x-tx)<.2&&Math.abs(P.y-ty)<.2){
      state='clear';sfx('win');score+=300+level*50;hud();
      setTimeout(()=>showCard('clear'),500);
    }
  }else{
    P.dieT-=dt;
    if(P.dieT<=0){
      lives--;hud();
      if(lives<0){state='over';saveHi();showCard('over');return}
      P.x=1;P.y=1;P.alive=true;P.inv=2.5;
    }
  }
  // enemies
  for(const e of enemies){
    if(e.dead<0)continue;
    if(e.dead>0){e.dead-=dt;if(e.dead<=0)e.dead=-1;continue}
    e.ph+=dt*6;
    if(bombAt(e.tx,e.ty)&&(e.tx!==e.px||e.ty!==e.py)){[e.tx,e.px]=[e.px,e.tx];[e.ty,e.py]=[e.py,e.ty]}
    const dx=e.tx-e.x,dy=e.ty-e.y,dist=Math.hypot(dx,dy),st=e.sp*dt;
    if(dist<=st){
      e.x=e.tx;e.y=e.ty;
      const dirs=[[1,0],[-1,0],[0,1],[0,-1]].filter(([a,b])=>passE(e.x+a,e.y+b));
      if(dirs.length){
        let c;const cur=[e.x-e.px,e.y-e.py];
        if(e.chase&&P.alive&&Math.random()<0.65){
          dirs.sort((p,q)=>Math.hypot(e.x+p[0]-P.x,e.y+p[1]-P.y)-Math.hypot(e.x+q[0]-P.x,e.y+q[1]-P.y));c=dirs[0];
        }else{
          const fw=dirs.find(([a,b])=>a===cur[0]&&b===cur[1]);
          c=fw&&Math.random()<0.75?fw:dirs[rnd(dirs.length)];
        }
        e.px=e.x;e.py=e.y;e.tx=e.x+c[0];e.ty=e.y+c[1];
      }else{e.px=e.x;e.py=e.y}
    }else{e.x+=dx/dist*st;e.y+=dy/dist*st}
    if(flames[K(Math.round(e.x),Math.round(e.y))]>0){e.dead=0.6;score+=e.chase?200:100;hud();buzz(25)}
    else if(P.alive&&Math.hypot(e.x-P.x,e.y-P.y)<0.62)killPlayer();
  }
}

/* ---------- drawing ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function buildBg(){
  bg=document.createElement('canvas');bg.width=cv.width;bg.height=cv.height;
  const g=bg.getContext('2d');g.setTransform(DPR*T,0,0,DPR*T,0,0);
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(grid[K(x,y)]===1){
      g.fillStyle='#2f3150';g.fillRect(x,y,1,1);
      g.fillStyle='#4a4d78';g.fillRect(x+.06,y+.06,.88,.8);
      g.fillStyle='#62679c';g.fillRect(x+.06,y+.06,.88,.12);
    }else{
      g.fillStyle=(x+y)%2?'#e9d3a3':'#e2c994';g.fillRect(x,y,1,1);
      if(y>0&&grid[K(x,y-1)]===1){g.fillStyle='#0000002a';g.fillRect(x,y,1,.18)}
    }
  }
}
function drawBlock(x,y,s){
  const o=(1-s)/2;ctx.save();ctx.translate(x+.5,y+.5);ctx.scale(s,s);ctx.translate(-.5,-.5);
  ctx.fillStyle='#7d2f22';ctx.fillRect(0,0,1,1);
  ctx.fillStyle='#c8553d';ctx.fillRect(.04,.04,.92,.86);
  ctx.fillStyle='#dd7a5c';ctx.fillRect(.04,.04,.92,.1);
  ctx.fillStyle='#7d2f22';
  ctx.fillRect(.04,.33,.92,.05);ctx.fillRect(.04,.62,.92,.05);
  ctx.fillRect(.48,.04,.05,.29);ctx.fillRect(.26,.38,.05,.24);ctx.fillRect(.72,.38,.05,.24);ctx.fillRect(.48,.67,.05,.23);
  ctx.restore();
}
function drawItem(x,y,type,t){
  const bob=Math.sin(t*4)*.03;
  if(type==='door'){
    const open=enemies.every(e=>e.dead<0);
    ctx.fillStyle='#3b2a1c';rr(x+.15,y+.12,.7,.8,[.35,.35,.05,.05]);ctx.fill();
    ctx.fillStyle=open?`rgba(255,201,60,${.65+Math.sin(t*6)*.3})`:'#5b4330';rr(x+.24,y+.22,.52,.66,[.26,.26,.03,.03]);ctx.fill();
    return;
  }
  ctx.fillStyle='#00000030';ctx.beginPath();ctx.ellipse(x+.5,y+.86,.3,.07,0,0,7);ctx.fill();
  ctx.fillStyle={b:'#5b8def',f:'#ef6c3e',s:'#4fbf86'}[type];rr(x+.15,y+.12+bob,.7,.7,.16);ctx.fill();
  ctx.fillStyle='#ffffff40';rr(x+.2,y+.16+bob,.6,.14,.07);ctx.fill();
  ctx.fillStyle='#fff';const cx=x+.5,cy=y+.48+bob;
  if(type==='b'){ctx.beginPath();ctx.arc(cx,cy+.04,.18,0,7);ctx.fill();ctx.fillRect(cx+.06,cy-.2,.06,.12)}
  if(type==='f'){ctx.beginPath();ctx.moveTo(cx,cy-.24);ctx.quadraticCurveTo(cx+.24,cy,cx+.14,cy+.18);ctx.lineTo(cx-.14,cy+.18);ctx.quadraticCurveTo(cx-.24,cy,cx,cy-.24);ctx.fill()}
  if(type==='s'){ctx.lineWidth=.08;ctx.strokeStyle='#fff';ctx.lineCap='round';for(const o of[-.1,.08]){ctx.beginPath();ctx.moveTo(cx+o-.06,cy-.14);ctx.lineTo(cx+o+.08,cy);ctx.lineTo(cx+o-.06,cy+.14);ctx.stroke()}}
}
function drawBomb(b,t){
  const x=b.x+.5,y=b.y+.52,p=1+Math.sin((FUSE-b.t)*(b.t<.8?28:10))*.06;
  ctx.fillStyle='#00000035';ctx.beginPath();ctx.ellipse(x,y+.34,.3,.08,0,0,7);ctx.fill();
  ctx.save();ctx.translate(x,y);ctx.scale(p,p);
  ctx.fillStyle=b.t<.8&&Math.sin(t*40)>0?'#5a1f1f':'#22202e';ctx.beginPath();ctx.arc(0,.04,.32,0,7);ctx.fill();
  ctx.fillStyle='#ffffff55';ctx.beginPath();ctx.arc(-.11,-.07,.08,0,7);ctx.fill();
  ctx.fillStyle='#55526a';ctx.fillRect(-.07,-.33,.14,.1);
  ctx.strokeStyle='#8a6b4a';ctx.lineWidth=.05;ctx.beginPath();ctx.moveTo(0,-.32);ctx.quadraticCurveTo(.12,-.46,.2,-.4);ctx.stroke();
  ctx.fillStyle=Math.random()<.5?'#ffc93c':'#fff3b0';ctx.beginPath();ctx.arc(.21,-.41,.06+Math.random()*.04,0,7);ctx.fill();
  ctx.restore();
}
function drawFlames(){
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const f=flames[K(x,y)];if(f<=0)continue;const a=f/FLAME,s=.55+.4*a;
    ctx.globalAlpha=Math.min(1,a*1.6);
    ctx.fillStyle='#ef6c3e';rr(x+.5-s/2,y+.5-s/2,s,s,s*.35);ctx.fill();
    ctx.fillStyle='#ffc93c';rr(x+.5-s*.33,y+.5-s*.33,s*.66,s*.66,s*.25);ctx.fill();
    ctx.fillStyle='#fff7d6';ctx.beginPath();ctx.arc(x+.5,y+.5,s*.16,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawPlayer(t){
  if(!P.alive&&P.dieT<=0)return;
  if(P.inv>0&&Math.floor(t*12)%2)return;
  const x=P.x+.5,y=P.y+.5;let sc=1,rot=0;
  if(!P.alive){const k=1-P.dieT/1.3;rot=k*7;sc=Math.max(0,1-k)}
  const bob=P.walk?Math.abs(Math.sin(P.walk))*.06:0;
  ctx.fillStyle='#00000035';ctx.beginPath();ctx.ellipse(x,y+.36,.28,.08,0,0,7);ctx.fill();
  ctx.save();ctx.translate(x,y-bob);ctx.rotate(rot);ctx.scale(sc,sc);
  const fs=P.walk?Math.sin(P.walk)*.08:0;
  ctx.fillStyle='#3a2840';ctx.beginPath();ctx.ellipse(-.13,.3+fs,.1,.06,0,0,7);ctx.ellipse(.13,.3-fs,.1,.06,0,0,7);ctx.fill();
  ctx.fillStyle='#fbefe0';ctx.beginPath();ctx.arc(0,.04,.3,0,7);ctx.fill();
  ctx.fillStyle='#2bb3a3';ctx.beginPath();ctx.arc(0,.02,.31,Math.PI*1.02,Math.PI*1.98);ctx.fill();
  ctx.fillStyle='#ffc93c';ctx.beginPath();ctx.arc(0,-.31,.06,0,7);ctx.fill();
  const [fx,fy]=P.face;ctx.fillStyle='#2b1d2f';rr(-.2+fx*.07,-.02+fy*.05,.4,.15,.07);ctx.fill();
  ctx.fillStyle='#7ff6e4';ctx.beginPath();ctx.arc(-.08+fx*.09,.055+fy*.05,.035,0,7);ctx.arc(.08+fx*.09,.055+fy*.05,.035,0,7);ctx.fill();
  ctx.restore();
}
function drawEnemy(e){
  if(e.dead<0)return;
  const x=e.x+.5,y=e.y+.5,w=Math.sin(e.ph)*.04,s=e.dead>0?e.dead/.6:1;
  ctx.fillStyle='#00000030';ctx.beginPath();ctx.ellipse(x,y+.36,.27,.07,0,0,7);ctx.fill();
  ctx.save();ctx.translate(x,y);ctx.scale(s*(1+w),s*(1-w));
  if(e.dead>0)ctx.globalAlpha=s;
  const c=e.chase?['#e2445c','#ff7a8a']:['#8a5cd6','#b48cf2'];
  ctx.fillStyle=c[0];ctx.beginPath();ctx.moveTo(-.32,.32);ctx.lineTo(-.32,0);ctx.arc(0,0,.32,Math.PI,0);ctx.lineTo(.32,.32);
  for(let i=0;i<4;i++)ctx.lineTo(.32-(i+.5)*.16,.24),ctx.lineTo(.32-(i+1)*.16,.32);ctx.fill();
  ctx.fillStyle=c[1];ctx.beginPath();ctx.arc(-.1,-.14,.1,0,7);ctx.fill();
  const lx=Math.sign(e.tx-e.x)*.05,ly=Math.sign(e.ty-e.y)*.05;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-.12,-.02,.1,0,7);ctx.arc(.12,-.02,.1,0,7);ctx.fill();
  ctx.fillStyle='#1a1120';ctx.beginPath();ctx.arc(-.12+lx,-.02+ly,.05,0,7);ctx.arc(.12+lx,-.02+ly,.05,0,7);ctx.fill();
  if(e.chase){ctx.strokeStyle='#1a1120';ctx.lineWidth=.04;ctx.beginPath();ctx.moveTo(-.22,-.17);ctx.lineTo(-.04,-.1);ctx.moveTo(.22,-.17);ctx.lineTo(.04,-.1);ctx.stroke()}
  ctx.restore();
}
function draw(t){
  ctx.setTransform(1,0,0,1,0,0);
  if(bg)ctx.drawImage(bg,0,0);
  const sx=shake>0?(Math.random()-.5)*shake:0,sy=shake>0?(Math.random()-.5)*shake:0;
  ctx.setTransform(DPR*T,0,0,DPR*T,sx*DPR*T,sy*DPR*T);
  for(const k in items)if(grid[k]===0)drawItem(k%COLS,Math.floor(k/COLS),items[k],t);
  for(let i=0;i<grid.length;i++)if(grid[i]===2)drawBlock(i%COLS,Math.floor(i/COLS),1);
  for(const b of breaking)drawBlock(b.x,b.y,b.t/0.4);
  for(const b of bombs)drawBomb(b,t);
  drawFlames();
  for(const e of enemies)drawEnemy(e);
  drawPlayer(t);
  ctx.fillStyle='#7d2f22';for(const p of parts){ctx.globalAlpha=p.t/.6;ctx.fillRect(p.x+.45,p.y+.45,.12,.12)}ctx.globalAlpha=1;
}

/* ---------- ui ---------- */
function hud(){$('hLv').textContent=level;$('hLife').textContent=Math.max(lives,0);$('hSc').textContent=score}
function saveHi(){if(score>hi){hi=score;try{localStorage.setItem('blokledak_hi',hi)}catch(e){}}}
const legend='<div class="legend"><span><i style="background:#5b8def"></i>+Bom</span><span><i style="background:#ef6c3e"></i>+Api</span><span><i style="background:#4fbf86"></i>+Cepat</span></div>';
function showCard(kind){
  ov.classList.remove('hide');let h='';
  if(kind==='menu')h=`<h1>Blok Ledak</h1><p>Hancurin bata, kalahin semua monster, terus cari pintu yang ngumpet di balik bata.</p>${legend}<p style="margin-top:12px">Rekor: <b>${hi}</b></p><button class="go" id="goBtn">Main</button>`;
  if(kind==='pause')h=`<h1>Jeda</h1><p>Level ${level} · Skor ${score}</p><button class="go" id="goBtn">Lanjut</button><p><button class="go" id="rsBtn" style="background:#c9b3c4;box-shadow:0 5px 0 #8d7a8a;font-size:18px;min-height:44px">Ulang dari awal</button></p>`;
  if(kind==='clear')h=`<h1>Level ${level} beres!</h1><p class="big">Skor ${score}</p><p>Level berikutnya monsternya lebih banyak.</p><button class="go" id="goBtn">Lanjut</button>`;
  if(kind==='over')h=`<h1>Game over</h1><p class="big">Skor ${score}</p><p>Sampai level ${level} · Rekor ${hi}</p><button class="go" id="goBtn">Main lagi</button>`;
  card.innerHTML=h;const g=$('goBtn');g.focus();
  g.addEventListener('click',()=>{unlock();
    if(kind==='menu'||kind==='over')newGame();
    else if(kind==='clear'){level++;newLevel();buildBg();state='play';ov.classList.add('hide')}
    else{state='play';ov.classList.add('hide')}
    if(kind!=='pause')buildBg();
  });
  const r=$('rsBtn');if(r)r.addEventListener('click',()=>{saveHi();newGame();buildBg()});
}
function togglePause(){if(state==='play'){state='pause';showCard('pause')}else if(state==='pause'){state='play';ov.classList.add('hide')}}

/* ---------- sizing + loop ---------- */
function fit(){
  const w=gameEl.clientWidth-16,h=gameEl.clientHeight-8;
  T=Math.max(16,Math.floor(Math.min(w/COLS,h/ROWS)));DPR=Math.min(window.devicePixelRatio||1,2.5);
  cv.style.width=COLS*T+'px';cv.style.height=ROWS*T+'px';
  cv.width=Math.round(COLS*T*DPR);cv.height=Math.round(ROWS*T*DPR);
  if(grid)buildBg();
}
const ro=new ResizeObserver(fit);ro.observe(gameEl);
P={speed:3.4,maxB:1,fire:1};newLevel();fit();buildBg();
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;
  const steps=Math.ceil(dt/0.0167);for(let i=0;i<steps;i++)update(dt/steps);
  draw(now/1000);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
showCard('menu');
}
</script>
