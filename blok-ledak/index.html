<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b1d2f">
<title>Blok Ledak</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blok Ledak">
<style>
@font-face{font-family:'Lilita One';src:url(fonts/lilita.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Nunito;src:url(fonts/nunito-600.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:Nunito;src:url(fonts/nunito-800.woff2) format('woff2');font-weight:800;font-display:swap}
/* VOICE: arcade, ceria, cepat
   IDEA: konsol genggam landscape — arena di tengah, tombol di kedua sisi
   PICTURE: arena 17x11 dengan sprite bulat bayangan
   COLOUR+TYPE: plum tua, lantai pasir, bata terakota, aksen kuning; Lilita One + Nunito
   LAYOUT: HUD tipis atas, kiri joystick, tengah arena, kanan tombol bom (duel: joystick P2 di kanan) */
:root{color-scheme:dark;--bg:#2b1d2f;--panel:#3a2840;--deep:#22172a;--ink:#fbefe0;--mut:#c9b3c4;--acc:#ffc93c}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 Nunito,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:none}
button{font-family:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"hud hud hud" "left game right";padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud{grid-area:hud;display:flex;align-items:center;gap:8px;padding:5px 12px;min-height:40px}
#hud .t{font:18px/1 'Lilita One',sans-serif;color:var(--acc);white-space:nowrap}
#hMode{color:var(--mut);font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hMid{margin:0 auto;font:20px/1 'Lilita One',sans-serif;white-space:nowrap}
#hMid.low{color:#ff6b6b}
.chip{background:var(--panel);border-radius:999px;padding:3px 10px;font-weight:800;font-size:13px;white-space:nowrap}
.chip b{color:var(--acc)}
#pause{width:40px;height:34px;border:0;border-radius:10px;background:var(--panel);color:var(--ink);font-weight:800}
#game{grid-area:game;display:grid;place-items:center;padding:2px 4px 6px}
#cv{display:block;border-radius:8px;box-shadow:0 0 0 3px #1a1120,0 10px 30px #0008}
.side{display:flex;flex-direction:column;min-height:0;position:relative}
#left{grid-area:left}#right{grid-area:right}
.stat{font-size:12px;color:var(--mut);padding:2px 10px 4px;line-height:1.5}
.stat b{color:var(--ink)}
.tag{display:inline-block;background:var(--panel);border-radius:6px;padding:0 6px;margin:2px 3px 0 0;font-weight:800;font-size:11px;color:var(--ink)}
.btnrow{display:flex;align-items:center;justify-content:center;gap:10px;padding:4px}
.joy{flex:1;position:relative;min-height:110px;touch-action:none}
.joy .hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:var(--mut);font-size:12px;pointer-events:none}
.base{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;background:radial-gradient(#ffffff14,#ffffff08);border:2px solid #ffffff22;left:50%;top:58%;opacity:.5;pointer-events:none}
.knob{position:absolute;width:50px;height:50px;left:29px;top:29px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6,#ffc93c 40%,#d9962a);box-shadow:0 4px 10px #0007}
.p2 .knob{background:radial-gradient(circle at 35% 30%,#fff6,#ff8a3d 40%,#c75f1f)}
.bomb{width:104px;height:104px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ff9b7a,#c8553d 55%,#8f3524);color:#fff;font:22px 'Lilita One',sans-serif;box-shadow:0 7px 0 #5d2418,0 12px 24px #0008;touch-action:none;flex:none}
.bomb.on,.rem.on{transform:translateY(5px);box-shadow:0 2px 0 #5d2418}
.rem{width:62px;height:62px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#a9b6d4,#6b7a99 60%,#47516a);color:#fff;font:14px 'Lilita One',sans-serif;box-shadow:0 5px 0 #2e3446;touch-action:none;flex:none}
.off{display:none!important}
body:not(.duel) #right{justify-content:flex-end;padding-bottom:max(18px,4vh)}
body:not(.duel) #right .btnrow{flex-direction:column;gap:14px}
body:not(.duel) #joyR,body:not(.duel) #left .btnrow,body:not(.duel) #statR{display:none}
body.duel .bomb{width:78px;height:78px;font-size:17px}
body.duel .rem{width:52px;height:52px;font-size:12px}
#ov{position:fixed;inset:0;display:grid;place-items:center;background:#1a1120d9;z-index:5;padding:12px}
#ov.hide{display:none}
.card{background:var(--panel);border-radius:20px;padding:16px 20px;max-width:680px;width:100%;max-height:calc(100dvh - 24px);overflow:auto;text-align:center;box-shadow:0 20px 50px #000a}
.card h1{font:34px/1.05 'Lilita One',sans-serif;margin:0 0 4px;color:var(--acc)}
.card h2{font:22px/1.1 'Lilita One',sans-serif;margin:0 0 4px}
.card p{margin:6px 0;color:var(--mut)}
.mhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;text-align:left}
.coinbig{font-weight:800;color:var(--mut)}.coinbig b{color:var(--acc);font-size:20px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-top:10px}
.mbtn{text-align:left;background:var(--deep);border:2px solid #ffffff14;border-radius:14px;padding:9px 12px;color:var(--ink);min-height:44px}
.mbtn:active{transform:scale(.98)}
.mbtn b{font:18px/1.2 'Lilita One',sans-serif;color:var(--acc);display:block}
.mbtn span{font-size:13px;color:var(--mut);display:block}
.mbtn i{font-style:normal;font-size:12px;color:var(--ink);opacity:.7}
.go{margin:12px 6px 0;min-height:48px;padding:0 26px;border:0;border-radius:14px;background:var(--acc);color:#2b1d2f;font:20px 'Lilita One',sans-serif;box-shadow:0 5px 0 #b8861d}
.go.alt{background:#c9b3c4;box-shadow:0 5px 0 #8d7a8a}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #b8861d}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.big{font:30px 'Lilita One',sans-serif;color:var(--ink);margin:4px 0}
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.pcard{background:var(--deep);border:2px solid #ffffff18;border-radius:16px;padding:12px 10px;color:var(--ink);text-align:center;min-height:120px}
.pcard:active{transform:scale(.97)}
.pcard .sw{width:38px;height:38px;border-radius:11px;margin:0 auto 8px;box-shadow:inset 0 -4px 0 #0003}
.pcard b{display:block;font:18px/1.1 'Lilita One',sans-serif}
.pcard span{font-size:12px;color:var(--mut)}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;margin-top:10px;text-align:left}
.srow{display:flex;align-items:center;gap:10px;background:var(--deep);border-radius:12px;padding:8px 10px}
.srow div{flex:1}
.srow b{display:block;font-size:15px}
.pips{font-size:12px;color:var(--mut);letter-spacing:2px}
.buy{min-width:74px;min-height:40px;border:0;border-radius:10px;background:var(--acc);color:#2b1d2f;font-weight:800}
.buy:disabled{background:#4a3a50;color:#8d7a8a}
#rot{position:fixed;inset:0;z-index:9;display:none;place-items:center;background:var(--bg);text-align:center;padding:24px}
#rot h2{font:28px 'Lilita One',sans-serif;color:var(--acc);margin:18px 0 6px}
#rot p{color:var(--mut);margin:0}
#rot .ph{width:70px;height:120px;border:5px solid var(--ink);border-radius:14px;margin:0 auto;animation:turn 2s ease-in-out infinite}
@keyframes turn{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rot{display:grid}}
@media (prefers-reduced-motion:reduce){#rot .ph{animation:none;transform:rotate(-90deg)}}
@media (max-height:340px){.bomb{width:88px;height:88px}.rem{width:54px;height:54px}#hud{min-height:34px;padding:3px 10px}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span class="t">Blok Ledak</span>
    <span id="hMode"></span>
    <span id="hMid"></span>
    <span class="chip" id="cLife">♥ <b id="hLife">3</b></span>
    <span class="chip" id="cSc">Skor <b id="hSc">0</b></span>
    <span class="chip">Koin <b id="hCoin">0</b></span>
    <button id="pause" aria-label="Jeda">II</button>
  </div>
  <div class="side" id="left">
    <div class="stat" id="statL"></div>
    <div class="btnrow"><button class="rem off" id="remL">LEDAK</button><button class="bomb" id="bombL">BOM</button></div>
    <div class="joy" id="joyL"><div class="base"><div class="knob"></div></div><div class="hint">Geser buat jalan</div></div>
  </div>
  <div id="game"><canvas id="cv"></canvas></div>
  <div class="side" id="right">
    <div class="stat" id="statR"></div>
    <div class="btnrow"><button class="rem off" id="remR">LEDAK</button><button class="bomb" id="bombR">BOM</button></div>
    <div class="joy p2" id="joyR"><div class="base"><div class="knob"></div></div><div class="hint">P2 geser di sini</div></div>
  </div>
</div>
<div id="ov"><div class="card" id="card"></div></div>
<div id="rot"><div><div class="ph"></div><h2>Putar HP lo</h2><p>Blok Ledak dimainin landscape.</p></div></div>

<script>
{
const COLS=17,ROWS=11,FUSE=2.4,FLAME=0.5;
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),gameEl=$('game'),ov=$('ov'),card=$('card');
let T=32,DPR=1,bg=null,bgDirty=true;
let grid,items={},bombs=[],flames=new Float32Array(COLS*ROWS),breaking=[],enemies=[],parts=[],floats=[],players=[];
let mode='adv',state='menu',level=1,score=0,lives=3,runCoins=0,coinMul=1,timeLeft=0,wave=0,waveT=0,dropT=0;
let duelWins=[0,0],round=1,doorKey=-1,doorShown=false,shake=0,banner=null,comboN=0,comboT=0,picks=[],lastSec=-1;

/* ---------- save ---------- */
const SK='blokledak_save2';
let save={coins:0,hi:{adv:0,time:0,surv:0},up:{bomb:0,fire:0,speed:0,life:0,shield:0,kick:0}};
try{const s=JSON.parse(localStorage.getItem(SK)||'null');if(s)save={coins:+s.coins||0,hi:{...save.hi,...s.hi},up:{...save.up,...s.up}};
  const old=+localStorage.getItem('blokledak_hi')||0;if(old>save.hi.adv)save.hi.adv=old}catch(e){}
function persist(){try{localStorage.setItem(SK,JSON.stringify(save))}catch(e){}}
function addCoins(n){if(mode==='duel')return;runCoins+=n;save.coins+=n;persist()}

/* ---------- data ---------- */
const IC={b:'#5b8def',f:'#ef6c3e',s:'#4fbf86',k:'#a66cff',r:'#6b7a99',w:'#9c6b3f',h:'#36c5f0',l:'#e2445c',m:'#ffc93c',t:'#2bb3a3'};
const NAME={b:'+1 Bom',f:'+1 Api',s:'Sepatu Kilat',k:'Tendang',r:'Remote',w:'Tembus Bata',h:'Perisai',l:'+1 Nyawa',m:'Koin ×2',t:'+30 Detik'};
const DESC={b:'Bisa naruh bom lebih banyak',f:'Ledakan makin panjang',s:'Lari lebih cepat',k:'Jalan ke bom buat nendang',r:'Bom meledak pas lo tekan LEDAK',w:'Jalan nembus bata',h:'Tahan 1 kali kena ledakan atau monster',l:'Nyawa tambahan',m:'Koin dobel sampai game selesai',t:'Tambah waktu'};
const MODES={adv:'Petualangan',time:'Lawan Waktu',surv:'Bertahan',duel:'Duel 2 Pemain'};
const SHOP=[{id:'bomb',n:'Bom awal +1',c:[30,80]},{id:'fire',n:'Api awal +1',c:[30,80]},{id:'speed',n:'Lari awal lebih cepat',c:[25,60]},{id:'life',n:'Nyawa awal +1',c:[50,120]},{id:'shield',n:'Mulai pakai perisai',c:[100]},{id:'kick',n:'Bisa nendang dari awal',c:[150]}];
const poolAdv=lv=>[['b',3],['f',3],['s',2],['h',1],['k',1]].concat(lv>=3?[['r',1]]:[],lv>=4?[['w',1]]:[]);
const poolDuel=[['b',3],['f',3],['s',2],['k',1],['r',1],['h',1],['w',1]];

/* ---------- audio ---------- */
let AC=null;
function unlock(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();else if(AC.state==='suspended')AC.resume()}catch(e){}}
function sfx(type){
  if(!AC)return;const t=AC.currentTime;
  if(type==='boom'){
    const len=.45,buf=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.2);
    const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
    f.type='lowpass';f.frequency.setValueAtTime(1400,t);f.frequency.exponentialRampToValueAtTime(120,t+len);
    g.gain.value=.5;s.buffer=buf;s.connect(f).connect(g).connect(AC.destination);s.start(t);return;
  }
  const P={drop:[300,180,.08,'square',.15],pick:[520,1040,.18,'triangle',.18],die:[400,60,.7,'sawtooth',.18],win:[440,880,.4,'triangle',.18],kick:[200,110,.1,'square',.15],coin:[988,1480,.1,'square',.07],shield:[300,900,.25,'triangle',.18]}[type];
  if(!P)return;const o=AC.createOscillator(),g=AC.createGain();o.connect(g).connect(AC.destination);
  o.type=P[3];o.frequency.setValueAtTime(P[0],t);o.frequency.exponentialRampToValueAtTime(P[1],t+P[2]);
  g.gain.setValueAtTime(P[4],t);g.gain.exponentialRampToValueAtTime(.001,t+P[2]);o.start(t);o.stop(t+P[2]);
}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

/* ---------- helpers ---------- */
const K=(x,y)=>y*COLS+x,inB=(x,y)=>x>=0&&y>=0&&x<COLS&&y<ROWS,rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const pickW=pool=>{let s=pool.reduce((a,p)=>a+p[1],0),r=Math.random()*s;for(const p of pool){if((r-=p[1])<0)return p[0]}return pool[0][0]};
const bombAt=(x,y)=>bombs.find(b=>b.x===x&&b.y===y);
const alive=e=>e.dead===0;
function passP(p,x,y){
  if(!inB(x,y))return false;const g=grid[K(x,y)];
  if(g===1||(g===2&&!p.pass))return false;
  if(bombAt(x,y)&&!(x===Math.round(p.x)&&y===Math.round(p.y)))return false;
  return true;
}
const passE=(x,y)=>inB(x,y)&&grid[K(x,y)]===0&&!bombAt(x,y);

/* ---------- setup ---------- */
function mkPlayer(i){
  const u=mode==='duel'?{bomb:0,fire:0,speed:0,shield:0,kick:0}:save.up;
  const sx=i?COLS-2:1,sy=i?ROWS-2:1;
  return{i,sx,sy,x:sx,y:sy,speed:3.4+u.speed*.4,maxB:1+u.bomb,fire:1+u.fire,shield:u.shield,kick:u.kick>0,remote:false,pass:false,
    alive:true,dieT:0,inv:1.5,face:[0,1],walk:0,col:i?'#ff8a3d':'#2bb3a3'};
}
function clearArena(){bombs=[];flames=new Float32Array(COLS*ROWS);breaking=[];parts=[];floats=[];enemies=[];items={};comboN=0;doorShown=false;
  for(const p of players){p.x=p.sx;p.y=p.sy;p.alive=true;p.dieT=0;p.inv=1.5;p.walk=0}}
function gen(o){
  grid=new Uint8Array(COLS*ROWS);const blocks=[];
  const safe=(x,y)=>players.some(p=>Math.abs(x-p.sx)+Math.abs(y-p.sy)<=2);
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(x===0||y===0||x===COLS-1||y===ROWS-1||(x%2===0&&y%2===0))grid[K(x,y)]=1;
    else if(!safe(x,y)&&Math.random()<o.dens){grid[K(x,y)]=2;blocks.push(K(x,y))}
  }
  shuffle(blocks);doorKey=-1;
  if(o.door){doorKey=blocks.pop();items[doorKey]='door'}
  for(let i=0;i<o.nPow&&blocks.length;i++)items[blocks.pop()]=pickW(o.pool);
  for(let i=0;i<o.nCoin&&blocks.length;i++)items[blocks.pop()]='c';
  bgDirty=true;
}
function spawnEnemies(n,chaseFrac,lv,minD,spawnT){
  const free=[];
  for(let y=1;y<ROWS-1;y++)for(let x=1;x<COLS-1;x++)
    if(grid[K(x,y)]===0&&!bombAt(x,y)&&flames[K(x,y)]<=0&&players.every(p=>Math.abs(x-p.x)+Math.abs(y-p.y)>=minD))free.push([x,y]);
  shuffle(free);
  for(let i=0;i<n&&free.length;i++){
    const [x,y]=free.pop(),chase=Math.random()<chaseFrac;
    enemies.push({x,y,tx:x,ty:y,px:x,py:y,sp:(chase?2.1:1.5)+Math.min(lv*.08,.8),chase,dead:0,ph:Math.random()*6,spawn:spawnT});
  }
}
function startLevel(){
  clearArena();
  gen({dens:Math.min(.36+level*.025,.55),door:true,nPow:level<3?4:3,nCoin:6,pool:poolAdv(level)});
  spawnEnemies(Math.min(3+level,12),level>=2?Math.min(.2+level*.04,.5):0,level,7,0);
  banner={txt:`Level ${level}`,t:1.6};hud();
}
function setupSurv(){clearArena();gen({dens:.3,door:false,nPow:3,nCoin:6,pool:poolAdv(5)});nextWave()}
function nextWave(){
  wave++;waveT=0;if(wave>1){score+=100*(wave-1);addCoins(wave-1)}
  // tumbuhkan bata baru
  const spots=[];
  for(let y=1;y<ROWS-1;y++)for(let x=1;x<COLS-1;x++){const k=K(x,y);
    if(grid[k]===0&&!items[k]&&!bombAt(x,y)&&flames[k]<=0&&players.every(p=>Math.abs(x-p.x)+Math.abs(y-p.y)>=3)&&!enemies.some(e=>alive(e)&&Math.round(e.x)===x&&Math.round(e.y)===y))spots.push(k)}
  shuffle(spots).slice(0,7).forEach(k=>{grid[k]=2;if(Math.random()<.3)items[k]='c';else if(Math.random()<.15)items[k]=pickW(poolAdv(5))});
  bgDirty=true;
  const live=enemies.filter(alive).length;
  spawnEnemies(Math.min(2+wave,14-live),Math.min(.12*wave,.6),wave,6,1);
  banner={txt:`Gelombang ${wave}`,t:1.6};hud();
}
function setupRound(){players=[mkPlayer(0),mkPlayer(1)];clearArena();gen({dens:.55,door:false,nPow:12,nCoin:0,pool:poolDuel});banner={txt:`Ronde ${round}`,t:1.6};hud()}
function startMode(m){
  mode=m;document.body.classList.toggle('duel',m==='duel');
  level=1;score=0;runCoins=0;coinMul=1;wave=0;waveT=0;dropT=14;duelWins=[0,0];round=1;timeLeft=150;lastSec=-1;
  players=m==='duel'?[mkPlayer(0),mkPlayer(1)]:[mkPlayer(0)];
  lives=m==='duel'?0:3+save.up.life;
  if(m==='surv')setupSurv();else if(m==='duel')setupRound();else startLevel();
  state='play';ov.classList.add('hide');fit();hud();
}

/* ---------- movement ---------- */
function moveAxis(p,ax,s,d){
  const A=ax,B=ax==='x'?'y':'x',free=(a,b)=>ax==='x'?passP(p,a,b):passP(p,b,a);
  const ca=Math.round(p[A]),cb=Math.round(p[B]),off=p[B]-cb,lanes=[cb],o2=off>=0?cb+1:cb-1;
  if(Math.abs(p[B]-o2)<.72)lanes.push(o2);
  for(const ln of lanes){
    const ahead=free(ca+s,ln),gap=p[B]-ln;
    if(Math.abs(gap)>.001){
      if(ahead&&(ln===cb||free(ca,ln))){const m=Math.min(Math.abs(gap),d);p[B]-=Math.sign(gap)*m;return m}
      continue;
    }
    p[B]=ln;let na=p[A]+s*d;
    if(!ahead){if((p[A]-ca)*s>=0)return 0;na=s>0?Math.min(na,ca):Math.max(na,ca)}
    const m=Math.abs(na-p[A]);p[A]=na;return m;
  }
  return 0;
}
function stepPlayer(p,dt){
  const v=vecFor(p.i),d=p.speed*dt;let moved=0;
  if(v.x||v.y){

      for(let y=1;y<ROWS-1;y++)for(let x=1;x<COLS-1;x++){const k=K(x,y);if(grid[k]===0&&!items[k]&&!bombAt(x,y))sp.push(k)}

  const bob=p.walk?Math.abs(Math.sin(p.walk))*.06:0;
  c.fillStyle='#00000035';c.beginPath();c.ellipse(x,y+.36,.28,.08,0,0,7);c.fill();
  c.save();if(inBlock)c.globalAlpha=.6;c.translate(x,y-bob);c.rotate(rot);c.scale(sc,sc);
  const fs=p.walk?Math.sin(p.walk)*.08:0;
  c.fillStyle='#3a2840';c.beginPath();c.ellipse(-.13,.3+fs,.1,.06,0,0,7);c.ellipse(.13,.3-fs,.1,.06,0,0,7);c.fill();
  c.fillStyle='#fbefe0';c.beginPath();c.arc(0,.04,.3,0,7);c.fill();
  c.fillStyle=p.col;c.beginPath();c.arc(0,.02,.31,Math.PI*1.02,Math.PI*1.98);c.fill();
  c.fillStyle='#ffc93c';c.beginPath();c.arc(0,-.31,.06,0,7);c.fill();
  const [fx,fy]=p.face;c.fillStyle='#2b1d2f';rr(c,-.2+fx*.07,-.02+fy*.05,.4,.15,.07);c.fill();
  c.fillStyle='#7ff6e4';c.beginPath();c.arc(-.08+fx*.09,.055+fy*.05,.035,0,7);c.arc(.08+fx*.09,.055+fy*.05,.035,0,7);c.fill();
  if(p.shield>0&&p.alive){c.strokeStyle=`rgba(54,197,240,${.55+Math.sin(t*5)*.25})`;c.lineWidth=.05;c.beginPath();c.arc(0,.02,.42,0,7);c.stroke();
    if(p.shield>1){c.beginPath();c.arc(0,.02,.49,0,7);c.stroke()}}
  if(mode==='duel'){c.fillStyle=p.col;c.font='bold .26px sans-serif';}
  c.restore();
}
function drawEnemy(e,t){
  if(e.dead<0)return;if(e.spawn>0&&Math.floor(t*10)%2)return;
  const c=ctx,x=e.x+.5,y=e.y+.5,w=Math.sin(e.ph)*.04,s=e.dead>0?e.dead/.6:(e.spawn>0?.7:1);
  c.fillStyle='#00000030';c.beginPath();c.ellipse(x,y+.36,.27,.07,0,0,7);c.fill();
  c.save();c.translate(x,y);c.scale(s*(1+w),s*(1-w));if(e.dead>0||e.spawn>0)c.globalAlpha=e.dead>0?s:.6;
  const col=e.chase?['#e2445c','#ff7a8a']:['#8a5cd6','#b48cf2'];
  c.fillStyle=col[0];c.beginPath();c.moveTo(-.32,.32);c.lineTo(-.32,0);c.arc(0,0,.32,Math.PI,0);c.lineTo(.32,.32);
  for(let i=0;i<4;i++){c.lineTo(.32-(i+.5)*.16,.24);c.lineTo(.32-(i+1)*.16,.32)}c.fill();
  c.fillStyle=col[1];c.beginPath();c.arc(-.1,-.14,.1,0,7);c.fill();
  const lx=Math.sign(e.tx-e.x)*.05,ly=Math.sign(e.ty-e.y)*.05;
  c.fillStyle='#fff';c.beginPath();c.arc(-.12,-.02,.1,0,7);c.arc(.12,-.02,.1,0,7);c.fill();
  c.fillStyle='#1a1120';c.beginPath();c.arc(-.12+lx,-.02+ly,.05,0,7);c.arc(.12+lx,-.02+ly,.05,0,7);c.fill();
  if(e.chase){c.strokeStyle='#1a1120';c.lineWidth=.04;c.beginPath();c.moveTo(-.22,-.17);c.lineTo(-.04,-.1);c.moveTo(.22,-.17);c.lineTo(.04,-.1);c.stroke()}
  c.restore();
}
function draw(t){
  if(!grid)return;
  if(bgDirty)buildBg();
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(bg,0,0);
  const sx=shake>0?(Math.random()-.5)*shake:0,sy=shake>0?(Math.random()-.5)*shake:0,S=DPR*T;
  ctx.setTransform(S,0,0,S,sx*S,sy*S);
  for(const k in items)if(grid[k]===0)drawItem(k%COLS,Math.floor(k/COLS),items[k],t);
  for(const b of breaking)drawBlock(ctx,b.x,b.y,b.t/.4);
  for(const b of bombs)drawBomb(b,t);
  drawFlames();
  for(const e of enemies)drawEnemy(e,t);
  for(const p of players)drawPlayer(p,t);
  ctx.fillStyle='#7d2f22';for(const p of parts){ctx.globalAlpha=p.t/.6;ctx.fillRect(p.x+.45,p.y+.45,.12,.12)}ctx.globalAlpha=1;
  // teks (pakai skala piksel)
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.textAlign='center';ctx.lineJoin='round';
  for(const f of floats){ctx.globalAlpha=Math.min(1,f.t*2);ctx.font=`${Math.round(T*.42)}px 'Lilita One',sans-serif`;
    ctx.lineWidth=4;ctx.strokeStyle='#2b1d2f';ctx.strokeText(f.txt,f.x*T,f.y*T);ctx.fillStyle=f.c;ctx.fillText(f.txt,f.x*T,f.y*T)}
  if(banner){ctx.globalAlpha=Math.min(1,banner.t*2);ctx.font=`${Math.round(T*1.1)}px 'Lilita One',sans-serif`;
    const bx=COLS*T/2,by=ROWS*T/2;ctx.lineWidth=8;ctx.strokeStyle='#2b1d2f';ctx.strokeText(banner.txt,bx,by);ctx.fillStyle='#ffc93c';ctx.fillText(banner.txt,bx,by)}
  if(mode==='duel')for(const p of players)if(p.alive){ctx.globalAlpha=1;ctx.font=`${Math.round(T*.34)}px 'Lilita One',sans-serif`;
    ctx.lineWidth=3;ctx.strokeStyle='#2b1d2f';const tx=(p.x+.5)*T,ty=(p.y-.05)*T;ctx.strokeText('P'+(p.i+1),tx,ty);ctx.fillStyle=p.col;ctx.fillText('P'+(p.i+1),tx,ty)}
  ctx.globalAlpha=1;
}

/* ---------- ui ---------- */
function statHTML(p,label){
  if(!p)return'';
  let s=`${label?`<b>${label}</b> · `:''}Bom <b>${p.maxB}</b> · Api <b>${p.fire}</b><br>`;
  if(p.kick)s+='<span class="tag">Tendang</span>';if(p.remote)s+='<span class="tag">Remote</span>';
  if(p.pass)s+='<span class="tag">Tembus</span>';if(p.shield)s+=`<span class="tag">Perisai${p.shield>1?' ×2':''}</span>`;
  if(coinMul>1&&mode!=='duel')s+='<span class="tag">Koin ×2</span>';
  return s;
}
function hud(){
  const duel=mode==='duel';
  $('hMode').textContent=MODES[mode]+' · '+(mode==='surv'?`Gelombang ${wave}`:duel?`Ronde ${round}`:`Lv ${level}`);
  const mid=$('hMid');
  if(mode==='time'){const s=Math.max(0,Math.ceil(timeLeft));mid.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;mid.classList.toggle('low',s<=20)}
  else if(duel){mid.textContent=`P1 ${duelWins[0]} – ${duelWins[1]} P2`;mid.classList.remove('low')}
  else{mid.textContent='';mid.classList.remove('low')}
  $('cLife').classList.toggle('off',duel);$('cSc').classList.toggle('off',duel);
  $('hLife').textContent=Math.max(lives,0);$('hSc').textContent=score;$('hCoin').textContent=save.coins;
  $('statL').innerHTML=statHTML(players[0],duel?'P1':'');$('statR').innerHTML=duel?statHTML(players[1],'P2'):'';
  $('remR').classList.toggle('off',!(duel?players[1]&&players[1].remote:players[0]&&players[0].remote));
  $('remL').classList.toggle('off',!(duel&&players[0]&&players[0].remote));
}
function showCard(kind,o={}){
  ov.classList.remove('hide');let h='';
  if(kind==='menu')h=`<div class="mhead"><h1>Blok Ledak</h1><span class="coinbig">Koin <b>${save.coins}</b></span></div>
    <div class="modes">
      <button class="mbtn" data-a="mode:adv"><b>Petualangan</b><span>Tembus level, pilih 1 perk tiap naik level</span><i>Rekor ${save.hi.adv}</i></button>
      <button class="mbtn" data-a="mode:time"><b>Lawan Waktu</b><span>Kejar pintu sebelum waktu habis. Beres level = +40 detik</span><i>Rekor ${save.hi.time}</i></button>
      <button class="mbtn" data-a="mode:surv"><b>Bertahan</b><span>Monster datang bergelombang. Tahan selama mungkin</span><i>Rekor ${save.hi.surv}</i></button>
      <button class="mbtn" data-a="mode:duel"><b>Duel 2 Pemain</b><span>Satu HP, kiri lawan kanan. Menang 3 ronde</span></button>
      <button class="mbtn" data-a="shop"><b>Toko Upgrade</b><span>Pakai koin buat bekal permanen di semua mode solo</span></button>
    </div>`;
  if(kind==='shop'){
    h=`<div class="mhead"><h1>Toko</h1><span class="coinbig">Koin <b>${save.coins}</b></span></div><div class="shop">`+
    SHOP.map(s=>{const lv=save.up[s.id],max=s.c.length,cost=s.c[lv];
      return`<div class="srow"><div><b>${s.n}</b><span class="pips">${'●'.repeat(lv)}${'○'.repeat(max-lv)}</span></div>
      <button class="buy" data-a="buy:${s.id}" ${lv>=max||save.coins<cost?'disabled':''}>${lv>=max?'Maks':cost+' koin'}</button></div>`}).join('')+
    `</div><button class="go alt" data-a="menu">Kembali</button>`;
  }
  if(kind==='pause')h=`<h1>Jeda</h1><p>${MODES[mode]} · ${mode==='duel'?`Ronde ${round}`:`Skor ${score}`}</p>
    <button class="go" data-a="resume">Lanjut</button><button class="go alt" data-a="retry">Ulang</button><button class="go alt" data-a="menu">Menu</button>`;
  if(kind==='pick')h=`<h2>Level ${level} beres!</h2><p>Pilih 1 perk buat level berikutnya</p><div class="picks">`+
    picks.map((id,i)=>`<button class="pcard" data-a="pick:${i}"><div class="sw" style="background:${IC[id]}"></div><b>${NAME[id]}</b><span>${DESC[id]}</span></button>`).join('')+`</div>`;
  if(kind==='over')h=`<h1>${o.reason==='time'?'Waktu habis':'Game over'}</h1><p class="big">Skor ${score}</p>
    <p>${mode==='surv'?`Sampai gelombang ${wave}`:`Sampai level ${level}`} · ${o.newBest?'Rekor baru!':`Rekor ${save.hi[mode]}`} · +${runCoins} koin</p>
    <button class="go" data-a="retry">Main lagi</button><button class="go alt" data-a="shop">Toko</button><button class="go alt" data-a="menu">Menu</button>`;
  if(kind==='roundres')h=`<h1>${o.msg}</h1><p class="big">P1 ${duelWins[0]} – ${duelWins[1]} P2</p><button class="go" data-a="round">Ronde berikutnya</button>`;
  if(kind==='match')h=`<h1>Pemain ${o.champ+1} juara!</h1><p class="big">P1 ${duelWins[0]} – ${duelWins[1]} P2</p>
    <button class="go" data-a="retry">Tanding lagi</button><button class="go alt" data-a="menu">Menu</button>`;
  card.innerHTML=h;const f=card.querySelector('button');if(f)f.focus({preventScroll:true});
}
ov.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;unlock();
  const [a,v]=b.dataset.a.split(':');
  if(a==='mode'){goFull();startMode(v)}
  if(a==='shop')showCard('shop');
  if(a==='buy'){const s=SHOP.find(s=>s.id===v),lv=save.up[v],c=s.c[lv];if(lv<s.c.length&&save.coins>=c){save.coins-=c;save.up[v]++;persist();sfx('pick')}showCard('shop');hud()}
  if(a==='menu'){state='menu';showCard('menu');hud()}
  if(a==='resume'){state='play';ov.classList.add('hide')}
  if(a==='retry')startMode(mode);
  if(a==='pick'){applyItem(players[0],picks[+v]);floats=[];level++;startLevel();state='play';ov.classList.add('hide')}
  if(a==='round'){round++;setupRound();state='play';ov.classList.add('hide')}
});
function togglePause(){if(state==='play'){state='pause';showCard('pause')}else if(state==='pause'){state='play';ov.classList.add('hide')}}

/* ---------- sizing + loop ---------- */
function fit(){
  const app=$('app'),W=app.clientWidth,H=app.clientHeight-$('hud').offsetHeight;
  const side=Math.max(mode==='duel'?128:118,W*.15);
  T=Math.max(14,Math.floor(Math.min((W-2*side-10)/COLS,(H-10)/ROWS)));
  DPR=Math.min(window.devicePixelRatio||1,2);
  cv.style.width=COLS*T+'px';cv.style.height=ROWS*T+'px';
  cv.width=Math.round(COLS*T*DPR);cv.height=Math.round(ROWS*T*DPR);bgDirty=true;
}
const ro=new ResizeObserver(fit);ro.observe($('app'));
players=[mkPlayer(0)];startLevel();banner=null;fit();hud();
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;
  const n=Math.ceil(dt/.0167);for(let i=0;i<n;i++)update(dt/n);
  draw(now/1000);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
showCard('menu');
if(location.search.includes('debug'))window.__bl={get players(){return players},get bombs(){return bombs},get enemies(){return enemies},get state(){return state},levelClear,doBomb,doRem,applyItem};
}
</script>
